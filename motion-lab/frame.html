<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: P; src: url('../shorts-charts/charts/pretendard.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root { --paper: #EAE6DF; --ink: #1C1B1A; --mute: #77736C; --accent: #E0592A; }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; font-family: P, sans-serif; color: var(--ink); }
  svg { position: absolute; inset: 0; }
  .kicker { position: absolute; left: 0; right: 0; top: 118px; text-align: center; font-weight: 600; font-size: 32px; letter-spacing: -0.01em; color: var(--mute); }
  .title { position: absolute; left: 0; right: 0; top: 160px; text-align: center; font-weight: 800; font-size: 66px; letter-spacing: -0.035em; line-height: 1; }
  .title em { font-style: normal; color: var(--accent); }
  .chip { position: absolute; left: 44px; display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 30px; letter-spacing: -0.02em;
          background: rgba(28,27,26,.86); color: #fff; padding: 10px 22px 10px 12px; border-radius: 999px; }
  .chip b { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--ink); font-size: 26px; font-weight: 800; }
  .chip.b b { background: var(--accent); color: #fff; }
  .chip span { opacity: .72; font-weight: 600; }
  .foot { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; font-size: 28px; color: var(--mute); }
</style></head>
<body>
<!-- 종이 바탕에 두 칸을 둥글게 뚫는다: 뚫린 자리로 A·B 영상이 보인다 -->
<svg width="1080" height="1920"><path id="paper" fill="#EAE6DF" fill-rule="evenodd"></path></svg>
<div class="kicker" id="kicker"></div>
<div class="title" id="title"></div>
<div class="chip" id="chipA"><b>A</b><div id="labA"></div></div>
<div class="chip b" id="chipB"><b>B</b><div id="labB"></div></div>
<div class="foot" id="foot"></div>
<script>
  // ?c={json}: { kicker, title(html), a, b, foot, panels:[[x,y,w,h],[x,y,w,h]], r }
  const c = JSON.parse(new URLSearchParams(location.search).get('c'));
  const rr = ([x, y, w, h], r) => `M${x + r},${y}h${w - 2 * r}a${r},${r} 0 0 1 ${r},${r}v${h - 2 * r}a${r},${r} 0 0 1 -${r},${r}h-${w - 2 * r}a${r},${r} 0 0 1 -${r},-${r}v-${h - 2 * r}a${r},${r} 0 0 1 ${r},-${r}z`;
  document.getElementById('paper').setAttribute('d', `M0,0H1080V1920H0Z ${c.panels.map((p) => rr(p, c.r)).join(' ')}`);
  for (const k of ['kicker', 'title', 'foot']) document.getElementById(k).innerHTML = c[k] || '';
  document.getElementById('labA').innerHTML = c.a; document.getElementById('labB').innerHTML = c.b;
  document.getElementById('chipA').style.top = c.panels[0][1] + 24 + 'px';
  document.getElementById('chipB').style.top = c.panels[1][1] + 24 + 'px';
  document.getElementById('foot').style.top = c.panels[1][1] + c.panels[1][3] + 26 + 'px';
  document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body></html>
