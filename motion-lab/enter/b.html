<script type="module">
/*
  ENTER — 엔터 한 번의 손맛 (prompt-b)
  구조
    1. TOKENS  : 모든 숫자(모델·색·조명·카메라·이징·스프링). 본문에는 숫자를 쓰지 않는다.
    2. SHOTS   : 프레임 표(언제 무엇이). 고침 지시는 대부분 여기 한 줄로 끝난다.
    3. 순수 함수: capBottom / capScale / capRot / stemDy / blockDy / camState / glintState  — 전부 f(프레임) → 값.
    4. stateAt(f) 가 위 함수를 모아 한 프레임의 상태를 만들고, applyState 가 씬에 꽂는다.
    5. window.renderAt(t) = applyState(stateAt(t·FPS)) + 렌더. 앞 프레임 상태를 쓰지 않는다.
*/
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ───────────────────────────────────────────── 1. TOKENS
const TOKENS = {
  W: 1080, H: 680, FPS: 30, FRAMES: 240, BEAT: 15,
  EASE: { enter: [0.16, 1, 0.3, 1], move: [0.76, 0, 0.24, 1], exit: [0.7, 0, 0.84, 0], pop: [0.34, 1.56, 0.64, 1] },
  COLOR: {
    bgCenter: 0xF1EEE9, bgEdge: 0xDCD7CF,
    cap: 0xF4F1EC, accent: 0xE0592A, housing: 0xD8D6D2, block: 0xC7CACF,
    key: 0xFFF3E6, fill: 0xE9EEF4, rim: 0xFFFFFF, groundShadow: 0x3A332C,
  },
  CAP: {                       // 1 unit = 1 cm
    w: 4.2, d: 1.8, h: 0.9, taper: 0.18, radius: 0.22, dish: 0.03,
    fillet: 0.07,              // 윗면 가장자리 둥글림(지시서에 숫자 없음 → 판단)
    wall: 0.1,
    rough: 0.42, clearcoat: 0.25, clearcoatRough: 0.2,
    seg: { corner: 8, edge: 18, side: 3, fillet: 5, top: 12 },
  },
  LEGEND: { inset: 0.35, stroke: 0.07, size: 0.5, tall: 0.34, arrowLen: 0.15, arrowHalf: 0.1, thick: 0.012, sink: 0.002, rough: 0.4 },
  SOCKET: { len: 0.40, wid: 0.13, h: 0.5 },
  SWITCH: { w: 1.5, h: 0.55, d: 1.5, radius: 0.05, opacity: 0.85, rough: 0.3, stemLen: 0.40, stemWid: 0.13, stemH: 0.4, stemRough: 0.45 },
  BLOCK: { w: 6.6, h: 0.7, d: 3.8, radius: 0.25, chamfer: 0.05, metal: 1, rough: 0.32, chamferRough: 0.08, seg: { corner: 10, edge: 24, top: 6 } },
  POSE: { rest: 0.62, bottom: 0.22 },                // 키캡 바닥 y (블록 윗면 = 0)
  LIGHT: {
    key: { pos: [-6, 9, 7], I: 3.0, map: 2048, bias: -0.0006, normalBias: 0.025, ext: 6 },
    fill: { pos: [7, -4, 5], I: 0.5 },               // 오른쪽 아래
    rim: { pos: [5, 7, -9], I: 3.5 },
    env: 0.35,
  },
  LOOK: {
    exposure: 0.9, vignette: 0.08, grain: 0.02,
    vignetteFrom: 0.3,
    groundGap: 0.9, groundOpacity: 0.45, groundFeather: 0.85, groundGrow: 0.15, groundOffset: [0.2, -0.15],
  },
  GLINT: {
    width: 6, strength: 6,     // FWHM(도), 세기
    bend: 8,                   // 법선 x 에 따른 띠 휨(도) — 곡면에서 반사처럼 휘게
    gateLo: 0.05, gateHi: 0.3, // 위를 향한 반사에만
    cap: { widthMul: 1.35, gain: 0.75 }, chamfer: { widthMul: 1, gain: 1 },
    margin: 1.3,               // 끝점에서 띠가 표면 밖으로 완전히 나가는 여유(FWHM 배수)
  },
  CAM: { fov: 30, dist: 17, near: 14.5, elev: 22, elevDrift: 0.8, az: 30, azMin: 22, targetY: 0.35, follow: 0.6, punch: 0.02 },
};

// ───────────────────────────────────────────── 2. SHOTS (프레임 표)
const SHOTS = {
  antic:  { from: 30, to: 39, hold: 41, lift: 0.05, tiltDeg: -2, ease: 'enter' },
  press:  { from: 41, to: 45, ease: 'exit' },
  impact: { at: 45, sy: 0.95, sxz: 1.02, spring: { z: 0.5, f: 6 }, block: { dip: 0.02, spring: { z: 0.6, f: 5 } } },
  launch: {
    at: 60,
    stemSpring: { z: 0.35, f: 4 },   // 스템이 튀어 오름(오버슈트 ≈ 0.12)
    stemSettle: { z: 0.3, f: 4 },    // 정점 이후 멈춤
    stretch: { in: 61, out: 65, sy: 1.08, sxz: 0.96, ease: 'pop', relax: { z: 0.5, f: 6 } },
  },
  flight: { from: 60, apex: 82, land: 105, rise: 2.8, zOut: 0.6, zEase: 'move' },
  flip:   { from: 62, to: 100, turns: 1, ease: 'move', faceCam: 81 },
  land:   { at: 105, sy: 0.9, sxz: 1.05, dip: 0.03, spring: { z: 0.55, f: 5 }, block: { dip: 0.012, spring: { z: 0.6, f: 5 } } },
  taps:   [{ from: 147, at: 150 }, { from: 162, at: 165 }],
  tap:    { ease: 'exit', spring: { z: 0.6, f: 6 }, sy: 0.97, sxz: 1.015, block: { dip: 0.012, spring: { z: 0.6, f: 5 } } },
  glint:  { farL: 215, inL: 225, center: 240, outR: 264, farR: 274 },   // 240 = 다음 루프의 0
  cam: {
    pushFrom: 42, pushTo: 60, pushEase: 'enter',
    followUp: [63, 85], followDown: [85, 108], followEase: 'move',   // 키캡보다 3프레임(100ms) 늦게
    punchAt: 105, punchIn: 6, punchInEase: 'enter', punchOut: 15, punchOutEase: 'move',
    pullFrom: 120, pullTo: 225, pullEase: 'move',
  },
};

// ───────────────────────────────────────────── 3. 수학 · 이징 · 스프링 (순수)
const PI = Math.PI, TAU = Math.PI * 2;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (f, a, b) => clamp01((f - a) / (b - a));
const sec = (frames) => frames / TOKENS.FPS;
const rad = (d) => d * PI / 180;

function cubicBezier([x1, y1, x2, y2]) {
  const bx = (s) => 3 * x1 * s * (1 - s) ** 2 + 3 * x2 * s * s * (1 - s) + s ** 3;
  const by = (s) => 3 * y1 * s * (1 - s) ** 2 + 3 * y2 * s * s * (1 - s) + s ** 3;
  const dx = (s) => 3 * x1 * (1 - s) ** 2 + 6 * (x2 - x1) * s * (1 - s) + 3 * (1 - x2) * s * s;
  return (t) => {
    if (t <= 0) return 0; if (t >= 1) return 1;
    let s = t;
    for (let i = 0; i < 8; i++) { const d = dx(s); if (Math.abs(d) < 1e-6) break; s -= (bx(s) - t) / d; if (s < 0 || s > 1) break; }
    if (!(s >= 0 && s <= 1) || Math.abs(bx(s) - t) > 1e-5) {         // 뉴턴 실패 → 이분법
      let lo = 0, hi = 1; s = t;
      for (let i = 0; i < 40; i++) { if (bx(s) < t) lo = s; else hi = s; s = (lo + hi) / 2; }
    }
    return by(s);
  };
}
const EASE = Object.fromEntries(Object.entries(TOKENS.EASE).map(([k, v]) => [k, cubicBezier(v)]));

// 감쇠비 닫힌 식: 0 → 1
function spring(t, z, fHz) {
  if (t <= 0) return 0;
  const w = TAU * fHz;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
// 타격 순간 1 → 스프링으로 0 (타격 전에는 0)
const settle = (f, at, sp) => (f < at ? 0 : 1 - spring(sec(f - at), sp.z, sp.f));

// 단조 3차 보간(Fritsch–Carlson) — 광택 띠 궤적용
function monotone(xs, ys) {
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]);
  return (x) => {
    if (x <= xs[0]) return ys[0]; if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], s = (x - xs[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * ys[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * ys[i + 1] + (s3 - s2) * h * m[i + 1];
  };
}

// ───────────────────────────────────────────── 4. 동작 함수 (프레임 → 값, 전부 순수)
const P = TOKENS.POSE;
const TRAVEL = P.rest - P.bottom;

function flightY(f) {
  const F = SHOTS.flight, apex = P.bottom + F.rise;
  if (f < F.apex) { const u = (F.apex - f) / (F.apex - F.from); return apex - F.rise * u * u; }
  const u = (f - F.apex) / (F.land - F.apex);
  return apex - (apex - P.rest) * u * u;
}

// 착지 이후(105~): 착지 눌림 + 리듬 두 번
function seatedY(f, n = SHOTS.taps.length) {
  for (let i = n - 1; i >= 0; i--) {
    const tp = SHOTS.taps[i];
    if (f < tp.from) continue;
    if (f < tp.at) return lerp(seatedY(tp.from, i), P.bottom, EASE[SHOTS.tap.ease](seg(f, tp.from, tp.at)));
    return P.bottom + TRAVEL * spring(sec(f - tp.at), SHOTS.tap.spring.z, SHOTS.tap.spring.f);
  }
  const L = SHOTS.land;
  return P.rest - L.dip * settle(f, L.at, L.spring);
}

// 키캡 바닥 높이(블록 기준)
function capBottom(f) {
  const A = SHOTS.antic, Pr = SHOTS.press, F = SHOTS.flight;
  if (f < A.from) return P.rest;
  if (f < Pr.from) return P.rest + A.lift * EASE[A.ease](seg(f, A.from, A.to));
  if (f < Pr.to) return lerp(P.rest + A.lift, P.bottom, EASE[Pr.ease](seg(f, Pr.from, Pr.to)));
  if (f < F.from) return P.bottom;
  if (f < F.land) return flightY(f);
  return seatedY(f);
}

function capZ(f) {
  const F = SHOTS.flight;
  if (f <= F.from || f >= F.land) return 0;
  return F.zOut * Math.sin(PI * EASE[F.zEase](seg(f, F.from, F.land)));
}

function capTilt(f) {
  const A = SHOTS.antic, Pr = SHOTS.press;
  if (f < A.from || f >= Pr.to) return 0;
  if (f < Pr.from) return rad(A.tiltDeg) * EASE[A.ease](seg(f, A.from, A.to));
  return rad(A.tiltDeg) * (1 - EASE[Pr.ease](seg(f, Pr.from, Pr.to)));
}

let FLIP_WARP = 0;   // init 에서 한 번 풀어 둔다(81 에 밑면이 카메라 정면)
function flipProgress(f) {
  const F = SHOTS.flip;
  if (f <= F.from || f >= F.to) return 0;
  const u = seg(f, F.from, F.to);
  return EASE[F.ease](u + FLIP_WARP * Math.sin(PI * u));
}
const capRot = (f) => capTilt(f) + TAU * SHOTS.flip.turns * flipProgress(f);

function capScale(f) {
  let dy = 0, dxz = 0;
  const add = (k, sy, sxz) => { dy += (sy - 1) * k; dxz += (sxz - 1) * k; };
  const I = SHOTS.impact, Ln = SHOTS.launch, S = Ln.stretch, L = SHOTS.land, T = SHOTS.tap;
  add(settle(f, I.at, I.spring), I.sy, I.sxz);
  let k = 0;
  if (f >= Ln.at && f < S.in) k = EASE[S.ease](seg(f, Ln.at, S.in));
  else if (f >= S.in && f < S.out) k = 1;
  else if (f >= S.out) k = settle(f, S.out, S.relax);
  add(k, S.sy, S.sxz);
  add(settle(f, L.at, L.spring), L.sy, L.sxz);
  for (const tp of SHOTS.taps) add(settle(f, tp.at, T.spring), T.sy, T.sxz);
  return { sy: 1 + dy, sxz: 1 + dxz };
}

// 스템: 평소엔 키캡을 따르고, 60~105 는 혼자 튄다
const STEM = (() => {
  const s = SHOTS.launch.stemSpring, w = TAU * s.f, wd = w * Math.sqrt(1 - s.z * s.z);
  const tPeak = PI / wd;
  return { tPeak, peak: -TRAVEL + TRAVEL * spring(tPeak, s.z, s.f) };
})();
function stemDy(f) {
  const Ln = SHOTS.launch, F = SHOTS.flight;
  if (f >= Ln.at && f < F.land) {
    const t = sec(f - Ln.at), s = Ln.stemSpring, z = Ln.stemSettle;
    if (t < STEM.tPeak) return -TRAVEL + TRAVEL * spring(t, s.z, s.f);
    return STEM.peak * (1 - spring(t - STEM.tPeak, z.z, z.f));
  }
  return Math.min(0, capBottom(f) - P.rest);
}

const housingDip = (f) => SHOTS.land.dip * settle(f, SHOTS.land.at, SHOTS.land.spring);

function blockDy(f) {
  const I = SHOTS.impact, L = SHOTS.land, T = SHOTS.tap;
  let y = -I.block.dip * settle(f, I.at, I.block.spring) - L.block.dip * settle(f, L.at, L.block.spring);
  for (const tp of SHOTS.taps) y -= T.block.dip * settle(f, tp.at, T.block.spring);
  return y;
}

// 카메라
function camState(f) {
  const C = TOKENS.CAM, S = SHOTS.cam, ph = TAU * f / TOKENS.FRAMES;
  const az = (C.az + C.azMin) / 2 + ((C.az - C.azMin) / 2) * Math.cos(ph);   // 30 → 22 → 30
  const el = C.elev + C.elevDrift * Math.sin(ph);                             // 서 있지 않게 하는 미세 드리프트
  let dist = f < S.pullFrom
    ? lerp(C.dist, C.near, EASE[S.pushEase](seg(f, S.pushFrom, S.pushTo)))
    : lerp(C.near, C.dist, EASE[S.pullEase](seg(f, S.pullFrom, S.pullTo)));
  const pIn = S.punchAt + S.punchIn;
  let pk = 0;
  if (f >= S.punchAt && f < pIn) pk = EASE[S.punchInEase](seg(f, S.punchAt, pIn));
  else if (f >= pIn) pk = 1 - EASE[S.punchOutEase](seg(f, pIn, pIn + S.punchOut));
  dist *= 1 - C.punch * pk;
  const liftMax = C.follow * (P.bottom + SHOTS.flight.rise - P.rest);
  let lift = 0;
  if (f >= S.followUp[0] && f < S.followDown[0]) lift = EASE[S.followEase](seg(f, S.followUp[0], S.followUp[1]));
  else if (f >= S.followDown[0]) lift = 1 - EASE[S.followEase](seg(f, S.followDown[0], S.followDown[1]));
  const target = [0, C.targetY + liftMax * lift, 0];
  const ce = Math.cos(rad(el));
  const pos = [target[0] + dist * ce * Math.sin(rad(az)), target[1] + dist * Math.sin(rad(el)), target[2] + dist * ce * Math.cos(rad(az))];
  return { pos, target, fov: C.fov };
}

// 광택 띠(카메라에서 본 각도, 도) — init 에서 키 프레임 위치를 풀어 둔다
let GLINT_PATH = null;
function glintState(f) {
  const G = SHOTS.glint;
  const x = f < G.farR - TOKENS.FRAMES ? f + TOKENS.FRAMES : f;   // 0~33 은 앞 루프의 연장
  const on = x >= G.farL && x <= G.farR;
  return { on, beta: on ? GLINT_PATH(x) : 0 };
}

function stateAt(fIn) {
  const N = TOKENS.FRAMES;
  const f = ((Math.round(fIn * 1e4) / 1e4) % N + N) % N;
  const sc = capScale(f);
  return {
    f,
    cap: { y: capBottom(f) + (TOKENS.CAP.h / 2) * sc.sy, z: capZ(f), rot: capRot(f), sy: sc.sy, sxz: sc.sxz },
    stemY: TOKENS.SWITCH.h + stemDy(f),
    housingSY: (TOKENS.SWITCH.h - housingDip(f)) / TOKENS.SWITCH.h,
    blockY: blockDy(f),
    cam: camState(f),
    glint: glintState(f),
  };
}

// ───────────────────────────────────────────── 5. 지오메트리
function rrect(w, d, r, nC, nE) {
  const a = w / 2 - r, b = d / 2 - r, C = [[a, b], [-a, b], [-a, -b], [a, -b]], pts = [];
  for (let k = 0; k < 4; k++) {
    const [cx, cz] = C[k];
    for (let i = 0; i <= nC; i++) { const p = (k + i / nC) * PI / 2; pts.push([cx + r * Math.cos(p), cz + r * Math.sin(p)]); }
    const [nx, nz] = C[(k + 1) % 4], p1 = (k + 1) * PI / 2;
    const e0 = [cx + r * Math.cos(p1), cz + r * Math.sin(p1)], e1 = [nx + r * Math.cos(p1), nz + r * Math.sin(p1)];
    for (let i = 1; i < nE; i++) { const s = i / nE; pts.push([lerp(e0[0], e1[0], s), lerp(e0[1], e1[1], s)]); }
  }
  return pts;
}
// 고리(ring) 여러 개를 띠로 잇는다. expect(centroid) 와 같은 쪽으로 면을 돌린다.
function loft(rings, expect) {
  const N = rings[0].length, pos = [], idx = [];
  for (const r of rings) for (const p of r) pos.push(p[0], p[1], p[2]);
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < N; j++) {
    const a = i * N + j, b = i * N + (j + 1) % N, c = (i + 1) * N + j, d = (i + 1) * N + (j + 1) % N;
    idx.push(a, b, d, a, d, c);
  }
  const v = (i) => new THREE.Vector3(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2]);
  for (let t = 0; t < idx.length; t += 3) {
    const A = v(idx[t]), B = v(idx[t + 1]), Cc = v(idx[t + 2]);
    const n = B.clone().sub(A).cross(Cc.clone().sub(A));
    if (n.length() < 1e-9) continue;
    const cen = A.add(B).add(Cc).multiplyScalar(1 / 3);
    if (n.dot(expect(cen)) < 0) for (let k = 0; k < idx.length; k += 3) { const s = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = s; }
    break;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const scaleRing = (ring, s, yFn) => ring.map(([x, , z]) => [x * s, yFn(z * s), z * s]);
const fanRings = (outer, n, yFn) => { const out = []; for (let k = n - 1; k >= 0; k--) out.push(scaleRing(outer, k / n, yFn)); return out; };

const K = TOKENS.CAP;
const DISH = (() => {
  const half = K.d / 2 - K.taper, R = (half * half + K.dish * K.dish) / (2 * K.dish);
  return (z) => Math.max(0, K.dish - (R - Math.sqrt(Math.max(0, R * R - z * z))));
})();
const CEIL = K.h - K.wall - K.dish;

function buildKeycap(mat, accentMat) {
  const g = new THREE.Group();
  const { corner: nC, edge: nE } = K.seg, rf = K.fillet, hs = K.h - rf;
  const sideInset = (y) => (K.taper - rf) * y / hs;
  const ring = (inset, r, yFn) => rrect(K.w - 2 * inset, K.d - 2 * inset, r, nC, nE).map(([x, z]) => [x, yFn(z), z]);
  // 바깥 셸: 옆벽 → 윗 모서리 둥글림 → 오목한 윗면(원통 접시)
  const outer = [];
  for (let i = 0; i <= K.seg.side; i++) { const y = hs * i / K.seg.side; outer.push(ring(sideInset(y), K.radius, () => y)); }
  for (let i = 1; i <= K.seg.fillet; i++) {
    const th = (i / K.seg.fillet) * PI / 2, e = rf * (1 - Math.cos(th));
    outer.push(ring(K.taper - rf + e, K.radius - e, (z) => hs + rf * Math.sin(th) - DISH(z) * Math.sin(th)));
  }
  const topRing = outer[outer.length - 1];
  outer.push(...fanRings(topRing, K.seg.top, (z) => K.h - DISH(z)));
  const centerY = new THREE.Vector3(0, K.h * 0.35, 0);
  g.add(new THREE.Mesh(loft(outer, (c) => c.clone().sub(centerY)), mat));
  // 밑면 테두리(벽 두께)
  const in0 = ring(K.wall, K.radius - K.wall, () => 0);
  g.add(new THREE.Mesh(loft([outer[0], in0], () => new THREE.Vector3(0, -1, 0)), mat));
  // 안쪽 셸 + 천장
  const inTop = ring(K.wall + sideInset(CEIL), K.radius - K.wall, () => CEIL);
  const inner = [in0, inTop, ...fanRings(inTop, K.seg.top / 2, () => CEIL)];
  g.add(new THREE.Mesh(loft(inner, (c) => new THREE.Vector3(-c.x, c.y > CEIL - 1e-4 ? -4 : 0, -c.z)), mat));
  // 십자 소켓
  const S = TOKENS.SOCKET;
  for (const [sx, sz] of [[S.len, S.wid], [S.wid, S.len]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sx, S.h, sz), mat);
    m.position.y = CEIL - S.h / 2; g.add(m);
  }
  // ↵ 기호(살짝 올린 판, 접시 곡면을 따라 휜다)
  const L = TOKENS.LEGEND, hs2 = L.stroke / 2, vb = L.arrowHalf;
  const sh = new THREE.Shape();
  [[0, vb], [L.arrowLen, vb - L.arrowHalf], [L.arrowLen, vb - hs2], [L.size, vb - hs2], [L.size, L.tall],
   [L.size - L.stroke, L.tall], [L.size - L.stroke, vb + hs2], [L.arrowLen, vb + hs2], [L.arrowLen, vb + L.arrowHalf]]
    .forEach(([u, v], i) => (i ? sh.lineTo(u, v) : sh.moveTo(u, v)));
  const lg = new THREE.ExtrudeGeometry(sh, { depth: L.thick, bevelEnabled: false });
  lg.rotateX(-PI / 2);                                         // 모양 v → -z(뒤), 두께 → +y
  const x0 = -(K.w / 2 - K.taper) + L.inset, z0 = -(K.d / 2 - K.taper) + L.inset;
  lg.translate(x0, 0, z0 + L.tall);
  const p = lg.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, p.getY(i) + K.h - DISH(p.getZ(i)) - L.sink);
  lg.computeVertexNormals();
  g.add(new THREE.Mesh(lg, accentMat));
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

function buildBlock(mat, chamferMat) {
  const B = TOKENS.BLOCK, { corner: nC, edge: nE } = B.seg, c = B.chamfer;
  const ring = (inset, r, y) => rrect(B.w - 2 * inset, B.d - 2 * inset, r, nC, nE).map(([x, z]) => [x, y, z]);
  const g = new THREE.Group();
  const bot = ring(0, B.radius, -B.h), sideTop = ring(0, B.radius, -c), top = ring(c, B.radius - c, 0);
  const out = (cc) => new THREE.Vector3(cc.x, 0, cc.z);
  g.add(new THREE.Mesh(loft([bot, sideTop], out), mat));
  const ch = new THREE.Mesh(loft([sideTop, top], (cc) => new THREE.Vector3(cc.x, 2, cc.z)), chamferMat);
  g.add(ch);
  g.add(new THREE.Mesh(loft([top, ...fanRings(top, B.seg.top, () => 0)], () => new THREE.Vector3(0, 1, 0)), mat));
  g.add(new THREE.Mesh(loft([bot, ...fanRings(bot, B.seg.top, () => -B.h)], () => new THREE.Vector3(0, -1, 0)), mat));
  g.traverse((o) => { if (o.isMesh) o.receiveShadow = true; });
  return g;
}

// ───────────────────────────────────────────── 6. 재질(광택 띠 주입)
const GLINT_U = { beta: { value: 0 }, strength: { value: 0 } };
function withGlint(mat, cfg) {
  const G = TOKENS.GLINT;
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, {
      uGlintBeta: GLINT_U.beta, uGlintStrength: GLINT_U.strength,
      uGlintWidth: { value: G.width * cfg.widthMul }, uGlintGain: { value: cfg.gain },
      uGlintBend: { value: G.bend }, uGlintGate: { value: new THREE.Vector2(G.gateLo, G.gateHi) },
    });
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uGlintBeta, uGlintStrength, uGlintWidth, uGlintGain, uGlintBend; uniform vec2 uGlintGate;`)
      .replace('#include <aomap_fragment>', `{
          vec3 gV = normalize(vViewPosition);
          vec3 gRw = (vec4(reflect(-gV, normal), 0.0) * viewMatrix).xyz;
          float gGate = smoothstep(uGlintGate.x, uGlintGate.y, gRw.y);
          vec3 gP = -vViewPosition;
          float gBeta = degrees(atan(gP.x, -gP.z)) + uGlintBend * normal.x;
          float gD = (gBeta - uGlintBeta) / uGlintWidth;
          float gBand = exp(-2.7725887 * gD * gD);
          float gFw = pow(1.0 - saturate(dot(normal, gV)), 5.0);
          vec3 gF = material.specularColor + (vec3(1.0) - material.specularColor) * gFw;
          #ifdef USE_CLEARCOAT
            gF += material.clearcoat * (0.04 + 0.96 * gFw);
          #endif
          reflectedLight.indirectSpecular += uGlintStrength * uGlintGain * gGate * gBand * gF;
        }
        #include <aomap_fragment>`);
  };
  return mat;
}

// ───────────────────────────────────────────── 7. 씬
const { W, H } = TOKENS;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.autoClear = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping ?? THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = TOKENS.LOOK.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;   // 한 번만
pmrem.dispose();

const camera = new THREE.PerspectiveCamera(TOKENS.CAM.fov, W / H, 0.5, 100);

const Lt = TOKENS.LIGHT, Cl = TOKENS.COLOR;
const key = new THREE.DirectionalLight(Cl.key, Lt.key.I);
key.position.set(...Lt.key.pos);
key.castShadow = true;
key.shadow.mapSize.set(Lt.key.map, Lt.key.map);
Object.assign(key.shadow.camera, { left: -Lt.key.ext, right: Lt.key.ext, top: Lt.key.ext, bottom: -Lt.key.ext, near: 0.5, far: 40 });
key.shadow.bias = Lt.key.bias; key.shadow.normalBias = Lt.key.normalBias;
const fill = new THREE.DirectionalLight(Cl.fill, Lt.fill.I); fill.position.set(...Lt.fill.pos);
const rim = new THREE.DirectionalLight(Cl.rim, Lt.rim.I); rim.position.set(...Lt.rim.pos);
scene.add(key, key.target, fill, rim);

const capMat = withGlint(new THREE.MeshPhysicalMaterial({
  color: Cl.cap, roughness: K.rough, clearcoat: K.clearcoat, clearcoatRoughness: K.clearcoatRough, envMapIntensity: Lt.env,
}), TOKENS.GLINT.cap);
const legendMat = new THREE.MeshPhysicalMaterial({ color: Cl.accent, roughness: TOKENS.LEGEND.rough, envMapIntensity: Lt.env });
const SW = TOKENS.SWITCH;
const stemMat = new THREE.MeshPhysicalMaterial({ color: Cl.accent, roughness: SW.stemRough, envMapIntensity: Lt.env });
const housingMat = new THREE.MeshPhysicalMaterial({ color: Cl.housing, roughness: SW.rough, transparent: true, opacity: SW.opacity, envMapIntensity: Lt.env });
const B = TOKENS.BLOCK;
const blockMat = new THREE.MeshPhysicalMaterial({ color: Cl.block, metalness: B.metal, roughness: B.rough, envMapIntensity: Lt.env });
const chamferMat = withGlint(new THREE.MeshPhysicalMaterial({ color: Cl.block, metalness: B.metal, roughness: B.chamferRough, envMapIntensity: Lt.env }), TOKENS.GLINT.chamfer);

// 조립: assembly(블록 진동) ⊃ 블록 · 하우징 · 스템 · 키캡
const assembly = new THREE.Group(); scene.add(assembly);
assembly.add(buildBlock(blockMat, chamferMat));
const housing = new THREE.Mesh(new RoundedBoxGeometry(SW.w, SW.h, SW.d, 4, SW.radius).translate(0, SW.h / 2, 0), housingMat);
housing.castShadow = true; housing.receiveShadow = true;
assembly.add(housing);
const stem = new THREE.Group();
for (const [sx, sz] of [[SW.stemLen, SW.stemWid], [SW.stemWid, SW.stemLen]]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, SW.stemH, sz).translate(0, SW.stemH / 2, 0), stemMat);
  m.castShadow = true; m.receiveShadow = true; stem.add(m);
}
assembly.add(stem);
const capPivot = new THREE.Group();          // 키캡 중심 = 회전·스케일 중심
const capBody = buildKeycap(capMat, legendMat);
capBody.position.y = -K.h / 2;
capPivot.add(capBody);
assembly.add(capPivot);

// 접지 그림자(바닥면 없이 그림자만)
const LK = TOKENS.LOOK;
const hexVec = (hex) => new THREE.Vector3(((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(B.w * 2.2, B.d * 3).rotateX(-PI / 2), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: {
    uHalf: { value: new THREE.Vector2(B.w / 2 + LK.groundGrow, B.d / 2 + LK.groundGrow) }, uR: { value: B.radius + LK.groundGrow },
    uFeather: { value: LK.groundFeather }, uOpacity: { value: LK.groundOpacity }, uColor: { value: hexVec(Cl.groundShadow) },
    uOffset: { value: new THREE.Vector2(...LK.groundOffset) },
  },
  vertexShader: `varying vec2 vXZ; uniform vec2 uOffset;
    void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vXZ = wp.xz - uOffset; gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `varying vec2 vXZ; uniform vec2 uHalf; uniform float uR, uFeather, uOpacity; uniform vec3 uColor;
    float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    void main(){ float d = sdRR(vXZ, uHalf, uR); gl_FragColor = vec4(uColor, uOpacity * (1.0 - smoothstep(-uFeather, uFeather, d))); }`,
}));
ground.position.y = -B.h - LK.groundGap;
ground.renderOrder = -1;
scene.add(ground);

// 배경(방사형 + 디더) · 마감(비네팅 + 그레인) — 톤 매핑 밖에서 sRGB 그대로
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadVS = `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const HASH = `float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  float radial(vec2 fc, vec2 res){ vec2 a = vec2(res.x / res.y, 1.0); return length((fc / res - 0.5) * a) / length(a * 0.5); }`;
const bgScene = new THREE.Scene();
const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false,
  uniforms: { uC0: { value: hexVec(Cl.bgCenter) }, uC1: { value: hexVec(Cl.bgEdge) }, uRes: { value: new THREE.Vector2(W, H) } },
  vertexShader: quadVS,
  fragmentShader: `uniform vec3 uC0, uC1; uniform vec2 uRes; ${HASH}
    void main(){ float r = radial(gl_FragCoord.xy, uRes);
      vec3 c = mix(uC0, uC1, smoothstep(0.0, 1.0, r)) + (hash(gl_FragCoord.xy) - 0.5) / 255.0;
      gl_FragColor = vec4(c, 1.0); }`,
}));
bgQuad.frustumCulled = false; bgScene.add(bgQuad);
const postScene = new THREE.Scene();
const postMat = new THREE.ShaderMaterial({
  depthTest: false, depthWrite: false, transparent: true,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.DstColorFactor, blendDst: THREE.SrcAlphaFactor,
  uniforms: { uRes: { value: new THREE.Vector2(W, H) }, uFrame: { value: 0 }, uVig: { value: LK.vignette }, uGrain: { value: LK.grain }, uVigFrom: { value: LK.vignetteFrom } },
  vertexShader: quadVS,
  fragmentShader: `uniform vec2 uRes; uniform float uFrame, uVig, uGrain, uVigFrom; ${HASH}
    void main(){ float k = 1.0 - uVig * smoothstep(uVigFrom, 1.0, radial(gl_FragCoord.xy, uRes));
      k *= 1.0 + uGrain * (hash(gl_FragCoord.xy + vec2(uFrame * 17.13, uFrame * 5.71)) * 2.0 - 1.0);
      gl_FragColor = vec4(vec3(k - 0.5), 0.5); }`,   // 결과 = dst × k
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat);
postQuad.frustumCulled = false; postScene.add(postQuad);

// ───────────────────────────────────────────── 8. 상태 → 씬
function applyCamera(cam, cs) {
  cam.fov = cs.fov; cam.position.set(...cs.pos); cam.lookAt(...cs.target);
  cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
}
function applyState(s) {
  assembly.position.y = s.blockY;
  housing.scale.y = s.housingSY;
  stem.position.y = s.stemY;
  capPivot.position.set(0, s.cap.y, s.cap.z);
  capPivot.rotation.set(s.cap.rot, 0, 0);
  capPivot.scale.set(s.cap.sxz, s.cap.sy, s.cap.sxz);
  applyCamera(camera, s.cam);
  GLINT_U.beta.value = s.glint.beta;
  GLINT_U.strength.value = s.glint.on ? TOKENS.GLINT.strength : 0;
  postMat.uniforms.uFrame.value = Math.round(s.f) % TOKENS.FRAMES;   // 그레인 시드 = 프레임 번호
}

// ───────────────────────────────────────────── 9. 초기 풀이(한 번, 결정적)
(function solveInit() {
  const scratch = new THREE.PerspectiveCamera(TOKENS.CAM.fov, W / H, 0.5, 100);
  const betaOf = (f, pts, pick) => {
    applyCamera(scratch, camState(f));
    const bs = pts.map((p) => { const v = new THREE.Vector3(...p).applyMatrix4(scratch.matrixWorldInverse); return Math.atan2(v.x, -v.z) * 180 / PI; });
    return pick(...bs);
  };
  const G = SHOTS.glint, N = TOKENS.FRAMES, GL = TOKENS.GLINT;
  const topY = P.rest + K.h - K.dish, tx = K.w / 2 - K.taper, tz = K.d / 2 - K.taper;
  const capTop = [[tx, topY, tz], [tx, topY, -tz], [-tx, topY, tz], [-tx, topY, -tz]];
  const bx = B.w / 2, bz = B.d / 2, blk = [[bx, 0, bz], [bx, 0, -bz], [-bx, 0, bz], [-bx, 0, -bz]];
  const mCap = GL.width * GL.cap.widthMul * GL.margin, mBlk = GL.width * GL.chamfer.widthMul * GL.margin;
  const xs = [G.farL, G.inL, G.center, G.outR, G.farR];
  const ys = [
    betaOf(G.farL % N, blk, Math.min) - mBlk,
    betaOf(G.inL % N, capTop, Math.min) - mCap,
    betaOf(G.center % N, [[0, topY, 0]], (b) => b),
    betaOf(G.outR % N, capTop, Math.max) + mCap,
    betaOf(G.farR % N, blk, Math.max) + mBlk,
  ];
  GLINT_PATH = monotone(xs, ys);

  // 공중제비: frame 81 에 밑면 법선이 카메라를 향하도록 시간 휨(warp) 하나를 푼다
  const F = SHOTS.flip, f = F.faceCam, cs = camState(f);
  const cy = blockDy(f) + capBottom(f) + (K.h / 2) * capScale(f).sy, cz = capZ(f);
  const dy = cs.pos[1] - cy, dz = cs.pos[2] - cz;
  let th = Math.atan2(-dz, -dy); if (th < 0) th += TAU;
  const want = th / (TAU * F.turns);
  let lo = 0, hi = 1;
  for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (EASE[F.ease](m) < want) lo = m; else hi = m; }
  const u = seg(f, F.from, F.to);
  FLIP_WARP = ((lo + hi) / 2 - u) / Math.sin(PI * u);
  window.__debug = { glint: { xs, ys }, flipTarget: th * 180 / PI, flipWarp: FLIP_WARP, stem: STEM };
})();

// ───────────────────────────────────────────── 10. 렌더 계약
function renderFrame(f) {
  applyState(stateAt(f));
  renderer.clear();
  renderer.render(bgScene, ortho);
  renderer.render(scene, camera);
  renderer.render(postScene, ortho);
}
window.TOKENS = TOKENS; window.SHOTS = SHOTS; window.stateAt = stateAt; window.__glintU = GLINT_U;
window.renderAt = (t) => renderFrame(t * TOKENS.FPS);
renderFrame(0);
window.__ready = true;
</script>
</body>
</html>
