name: 기존 영상 재업로드

# 이미 렌더된 mp4 를 다른 채널·다른 공개상태로 다시 올린다.
#
# ★왜 필요한가★ 발행이 잘못된 채널로 나간 적이 있다. 유튜브는 영상을 채널 간에 옮길 수
# 없어서, 되살리려면 파일을 손으로 내려받아 스튜디오에 다시 올려야 했다. 영상 파일은
# 워크플로 아티팩트에 7일간 남아 있으므로, 그 run 번호만 주면 여기서 다시 올린다.
#
# ★돈이 들지 않는다★ 대본·나레이션·렌더를 다시 하지 않는다. 유튜브 업로드 할당량만 쓴다.
# 그래도 "공개되는 행위"라 무료 점검용 dispatch 에는 두지 않고 전용 이벤트로 받는다.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '영상이 들어 있는 워크플로 run 번호 (video-output 아티팩트)'
        required: true
      channel:
        description: '업로드 채널 (default | ch2)'
        required: true
        default: 'default'
      privacy:
        description: '공개 상태 (private | unlisted | public)'
        required: false
        default: 'unlisted'
      title:
        description: '제목 덮어쓰기 (비우면 원래 대본 제목 그대로)'
        required: false
        default: ''
  repository_dispatch:
    types: [reupload]

permissions:
  contents: read
  actions: read # 다른 run 의 아티팩트를 내려받으려면 필요하다

jobs:
  reupload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || 'default' }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || github.event.client_payload.privacy || 'unlisted' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
      YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
      YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
      # config.ts 가 로드될 때 있어야 하는 값들 — 이 작업에서는 쓰이지 않는다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 원본 run 에서 영상 내려받기
        uses: actions/download-artifact@v4
        with:
          name: video-output
          run-id: ${{ github.event.inputs.source_run_id || github.event.client_payload.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out

      - name: 무엇을 올리는지 먼저 찍는다
        env:
          NEW_TITLE: ${{ github.event.inputs.title || github.event.client_payload.title || '' }}
        run: |
          # ★올리기 전에 사람이 눈으로 확인할 수 있게 남긴다★ 채널을 잘못 고른 사고를
          # 되돌리려고 만든 워크플로인데, 여기서 또 조용히 엉뚱한 채널로 가면 의미가 없다.
          test -f out/video.mp4 || { echo "::error::out/video.mp4 가 없습니다 (아티팩트가 만료됐을 수 있습니다 — 7일)"; exit 1; }
          test -f out/script.json || { echo "::error::out/script.json 이 없습니다"; exit 1; }
          if [ -n "$NEW_TITLE" ]; then
            jq --arg t "$NEW_TITLE" '.title = $t' out/script.json > out/script.tmp && mv out/script.tmp out/script.json
          fi
          echo "채널: $TARGET_CHANNEL · 공개상태: $YOUTUBE_PRIVACY_STATUS"
          echo "제목: $(jq -r .title out/script.json)"
          echo "영상: $(du -h out/video.mp4 | cut -f1)"

      - name: 유튜브 업로드
        run: npm run upload

      - name: 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reupload-result
          path: out/upload-result.json
          if-no-files-found: ignore
          retention-days: 7
