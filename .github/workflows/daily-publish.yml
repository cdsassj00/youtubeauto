name: 매일 AI 영상 자동 발행

on:
  # ── 주식 데일리 자동 발행 ────────────────────────────────────────────────
  # 아래 두 줄의 주석을 풀면 평일 17:30 KST 에 자동으로 돈다.
  #
  # ★왜 17:30 KST 인가★ 한국장이 15:30 에 마감하므로 종가가 반영돼 있고, 미국장은
  # 그날 아침 05:00 KST 에 이미 끝나 확정 상태다. 한 번 호출로 한국·미국 소재를 다 얻는다.
  # (미국편을 아침에 따로 만들려면 '10 21 * * 0-4' = 06:10 KST 를 하나 더 둔다.)
  #
  # ★켜기 전에 반드시 확인할 것★ 스케줄 실행은 inputs 가 전부 비어 아래 기본값으로 돈다.
  # vars 에 VIDEO_ENGINE=stock, STOCK_MARKET=KR, TARGET_CHANNEL·PRIVACY 를 맞춰 두지 않으면
  # 엉뚱한 엔진으로 기본 채널에 올라간다(실제로 그 사고가 한 번 났다).
  #
  # 브리프가 낡은 날에는 대본 스텝이 skip=true 를 내고 뒤 단계가 전부 건너뛴다.
  schedule:
    - cron: '30 8 * * 1-5'    # 08:30 UTC = 17:30 KST 평일 — 한국장 마감(15:30) 뒤
    # ★미국편★ 미국장 마감은 16:00 ET 인데, 서머타임이면 20:00 UTC, 아니면 21:00 UTC 다.
    # 둘 다 지난 뒤로 두려면 21:30 UTC 가 안전하다(겨울에도 마감 30분 뒤).
    # KST 로는 다음 날 06:30 이라, 한국 사람이 아침에 미국장 결과를 보는 시간대와 맞는다.
    # 요일이 UTC 월~금이면 KST 화~토가 된다 — 금요일 미국장 결과가 토요일 아침에 나가는 것이
    # 맞다(그날 미국장이 실제로 열렸으므로). 시장 구분은 아래 STOCK_MARKET 에서 한다.
    - cron: '30 21 * * 1-5'   # 21:30 UTC = 06:30 KST 다음 날 — 미국장 마감 뒤
  workflow_dispatch:
    inputs:
      topic:
        description: '영상 주제 (비우면 모드에 따라 자동 선택)'
        required: false
        default: ''
      content_mode:
        description: '주제 모드 (auto | trend | basics)'
        required: false
        default: 'auto'
      content_level:
        description: '대본 난이도 (basic | intermediate | expert)'
        required: false
        default: 'expert'
      do_upload:
        description: '유튜브 업로드 여부 (true | false)'
        required: false
        default: 'true'
      channel:
        description: '업로드 채널 (default | ch2)'
        required: false
        default: 'default'
      privacy:
        description: '공개 상태 (public | unlisted | private). 리뷰 흐름은 unlisted 로 올려 확인 후 발행.'
        required: false
        default: ''
      market:
        description: '주식 데일리 시장 (KR | US) — style=stock 일 때만 쓰임'
        required: false
        default: 'KR'
      max_min:
        description: '주식 데일리 목표 길이(분). 비우거나 0 이면 전체(약 9분 30초)'
        required: false
        default: '0'
      style:
        description: '영상 스타일 (stock=주식 데일리 | (illustrated=2D 벡터 | scrapbook=빈티지 판화 스크랩북 | footage=실사 스톡 | deck3d=3D 기하학 | signal=데이터 중심 | signal3d=시그널+3D | hyper=모션 타이포 | handdrawn=손그림 | listing=목록형 사진카드 | whiteboard=화이트보드)'
        required: false
        default: ''
  # 웹앱/외부에서 트리거 (client_payload 로 topic 전달)
  repository_dispatch:
    types: [publish-video]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 파이프라인 단계별 스텝이 공유하는 환경변수 (웹앱 진행바가 스텝을 읽을 수 있도록 4단계로 분리)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # 음성ID는 Variables/Secrets 어느 쪽에 넣어도 잡히게 둘 다 본다.
      # (키는 secrets 에, 음성ID는 vars 에서만 읽고 있어서 시크릿에 넣은 값이 무시되던 문제)
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || secrets.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # 공개 상태: 리뷰 흐름은 웹앱이 unlisted 로 전달 → 확인 후 발행(public)으로 전환. 스케줄은 vars 기본값.
      # 스케줄 발행은 비공개로 쌓는다 — 아무도 안 본 영상이 매일 공개로 나가는 것을 막는다.
      # 공개 자동 발행으로 바꾸려면 여기 'private' 을 'public' 으로 고친다.
      YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || github.event.client_payload.opts.privacy || github.event.client_payload.privacy || (github.event_name == 'schedule' && 'private') || vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '27' }}
      YOUTUBE_DESC_FOOTER: ${{ vars.YOUTUBE_DESC_FOOTER || 'AX전환은 CDSA와 함께\nhttps://cdsa.kr' }}
      # ── 두 번째 채널(ch2) 자격증명 — TARGET_CHANNEL=ch2 일 때 사용. 새 채널 OAuth 후 아래 시크릿을 등록. ──
      # (client id/secret 은 같은 OAuth 앱을 공유하면 위 기본값으로 폴백되므로 refresh token 만 필수)
      YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
      YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
      YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
      YOUTUBE_CATEGORY_ID_CH2: ${{ vars.YOUTUBE_CATEGORY_ID_CH2 }}
      YOUTUBE_DESC_FOOTER_CH2: ${{ vars.YOUTUBE_DESC_FOOTER_CH2 }}
      YOUTUBE_PRIVACY_STATUS_CH2: ${{ vars.YOUTUBE_PRIVACY_STATUS_CH2 }}
      # 업로드 대상 채널 선택 (default | ch2). 웹앱/수동 실행에서 전달.
      # ★스케줄 실행은 inputs 가 전부 비어 있다★ 그대로 두면 'default'(AI 강의 채널)로
      # 떨어져 주식 영상이 남의 채널에 올라간다 — 실제로 한 번 그렇게 발행됐다.
      # vars 설정에 기대지 않고 여기서 못박는다.
      TARGET_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || (github.event_name == 'schedule' && 'ch2') || 'default' }}
      # 합성 콘텐츠 공개 표시 — 목소리 클론 나레이션 + 비실사 일러스트는 YouTube 명시적 예외 대상이라 기본 false.
      SYNTHETIC_MEDIA_DISCLOSURE: ${{ vars.SYNTHETIC_MEDIA_DISCLOSURE || 'false' }}
      # TOPIC 은 잡 수준에 두지 않는다 — '대본 생성' 스텝에만 있다(위 주석 참고).
      CONTENT_MODE: ${{ github.event.inputs.content_mode || github.event.client_payload.content_mode || vars.CONTENT_MODE || 'auto' }}
      # 대본 난이도/전문성: basic | intermediate | expert. 기본 expert(전문가용).
      CONTENT_LEVEL: ${{ github.event.inputs.content_level || github.event.client_payload.content_level || vars.CONTENT_LEVEL || 'expert' }}
      TARGET_MINUTES: ${{ github.event.client_payload.target_minutes || vars.TARGET_MINUTES || '10' }}
      CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'ko' }}
      # 나레이션 배속(1=원속). 조금 빠르게 읽어 정보 밀도를 높인다.
      # 1.12 였는데 illustrated 엔진에서는 이 값이 아무 일도 하지 않았다(항상 1.0배로 나갔다).
      # 배선을 고치면서 요청대로 1.2 로 올린다 — 실제로 체감이 바뀌는 건 이번이 처음이다.
      # 비우면 config.ts 가 말투에 맞춰 고른다(설명형 1.2 / 이야기형 1.0).
      # 예전엔 여기서 '1.2' 를 못 박아 감동 서사에도 빠른 배속이 그대로 나갔다.
      NARRATION_SPEED: ${{ github.event.client_payload.opts.speed || github.event.client_payload.speed || vars.NARRATION_SPEED || '' }}
      # 배경음악 결. 비우면 config 가 말투를 보고 고른다(이야기형 warm / 설명형 lofi).
      BGM_STYLE: ${{ github.event.client_payload.opts.bgm_style || vars.BGM_STYLE || '' }}
      DO_UPLOAD: ${{ github.event.inputs.do_upload || github.event.client_payload.do_upload || 'true' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      OPENAI_ILLUSTRATION_MODEL: ${{ vars.OPENAI_ILLUSTRATION_MODEL || 'gpt-image-1-mini' }}
      # 대본 전 최신정보 웹서치 담당: openai(기본, 저비용) | anthropic(Claude 웹서치 폴백).
      RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'openai' }}
      OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-4.1-mini' }}
      PRESENTER_IMAGE_URL: ${{ secrets.PRESENTER_IMAGE_URL || vars.PRESENTER_IMAGE_URL || '' }}
      # 썸네일 구성: text(글씨가 주인공) | visual(장면이 주인공). 비우면 채널별 기본값.
      THUMBNAIL_FOCUS: ${{ vars.THUMBNAIL_FOCUS }}
      THUMBNAIL_FOCUS_CH2: ${{ vars.THUMBNAIL_FOCUS_CH2 }}
      # 이 채널이 무엇을 다루는지 — 그림 소재를 정하는 문장. 비우면 채널별 기본값.
      THUMBNAIL_CONTEXT: ${{ vars.THUMBNAIL_CONTEXT }}
      THUMBNAIL_CONTEXT_CH2: ${{ vars.THUMBNAIL_CONTEXT_CH2 }}
      THUMBNAIL_TONE: ${{ vars.THUMBNAIL_TONE || 'dark' }}
      # 썸네일 스타일(배경·글씨체·액센트 한 벌). auto 면 회차마다 회전.
      THUMBNAIL_STYLE: ${{ github.event.client_payload.opts.thumb_style || vars.THUMBNAIL_STYLE || 'chalk' }}
      # 영상 엔진: illustrated(AI 흑백 일러스트) | web3d(3D 웹녹화) | remotion(손그림). 기본 illustrated.
      # style=stock 일 때 어느 시장 브리프를 쓸지. 다른 엔진에서는 무시된다.
      # ★어느 크론이 깨웠는지로 시장을 가른다★ github.event.schedule 에는 이 실행을 부른
      # 크론 문자열이 그대로 들어온다. 21:30 UTC 는 미국장 마감 뒤에 두 편이라 US,
      # 08:30 UTC(한국장 마감 뒤)는 KR 이다. 여기 문자열은 위 schedule 의 cron 과
      # 글자까지 같아야 한다 — 한 글자만 달라도 조용히 KR 로 떨어진다.
      STOCK_MARKET: ${{ github.event.inputs.market || github.event.client_payload.opts.market || github.event.client_payload.market || (github.event.schedule == '30 21 * * 1-5' && 'US') || 'KR' }}
      # style=stock 일 때 목표 길이(분). 0 이면 전부 쓴다.
      # ★스케줄은 8분으로 자른다★ 0(전부)이면 설명 나레이션이 붙어 12분을 넘는다.
      # 매일 나가는 데이터 영상으로는 너무 길다. 늘리려면 이 숫자만 바꾸면 된다.
      STOCK_MAX_MIN: ${{ github.event.inputs.max_min || github.event.client_payload.opts.max_min || (github.event_name == 'schedule' && '8') || '0' }}
      VIDEO_ENGINE: ${{ github.event.inputs.style || github.event.client_payload.opts.style || github.event.client_payload.style || (github.event_name == 'schedule' && 'stock') || vars.VIDEO_ENGINE || 'illustrated' }}
      # 목록형 엔진이 쓸 자료 폴더(assets/listing/<이름>/items.json).
      LISTING_SET: ${{ github.event.client_payload.opts.listing_set || '' }}
      # 씬 일러스트 화풍(src/lib/artStyle.ts). 'auto' 는 회차마다 날짜 기준으로 회전.
      # 기본은 isometric — 지정이 없을 때 기존 채널 그림체가 유지되도록.
      ART_STYLE: ${{ github.event.client_payload.opts.art_style || github.event.client_payload.art_style || vars.ART_STYLE || 'isometric' }}
      # 나레이션 말투(src/lib/tone.ts): documentary | humorous | storytelling | mystery
      NARRATION_TONE: ${{ github.event.client_payload.opts.narration_tone || github.event.client_payload.narration_tone || vars.NARRATION_TONE || 'documentary' }}
      # 이미지 생성 provider: openai | gemini(Nano Banana — 회화적 화풍에 강하고 장당 더 저렴).
      # GEMINI_API_KEY 가 없으면 gemini 로 설정해도 일러스트 생성이 건너뛰어지므로 기본은 openai.
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'openai' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
      # Pexels 스톡 영상 B롤 — 한 화면이 15~20초씩 정지해 프리젠테이션처럼 보이던 것을
      # 2.5~4초 인서트 컷으로 끊는다. 키가 없으면 B롤 없이 기존대로 렌더된다.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          # ★22 이상이어야 한다★ hyper 엔진이 쓰는 HyperFrames 가 Node >= 22 를 요구하고,
          # 미달이면 bin 래퍼가 시작하자마자 거부한다. 렌더는 대본·나레이션(유료)을 다 만든
          # 뒤 3단계에서 도는 단계라, 여기서 버전이 낮으면 돈을 다 쓰고 마지막에 실패한다.
          # (Actions 도 Node 20 을 지원 종료 중이라 어차피 올려야 하는 값이다.)
          node-version: 22
          cache: 'npm'

      - name: 한국어 폰트 & Chromium 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-nanum fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2
          sudo fc-cache -f

      - name: 의존성 설치
        run: npm ci

      - name: Remotion 브라우저 준비
        run: npx remotion browser ensure

      - name: Playwright 브라우저 준비 (3D 웹녹화용)
        run: npx playwright install --with-deps chromium

      # ── 여기부터 4단계: 웹앱 진행바가 이 스텝 이름으로 진행도를 표시 ──
      - name: 대본 생성
        id: script
        run: npm run generate:script
        # ★TOPIC 은 여기서만 준다★
        # 잡 수준 env 에 두면 GitHub 가 "모든" 스텝의 시작에 env 덤프를 찍으면서
        # 브리프 전문(수백 줄)이 스텝 수만큼 반복돼 로그 꼬리를 통째로 채운다.
        # 그래서 정작 마지막에 찍은 집계(B롤·도식 개수)를 로그로는 꺼내 볼 수가 없었다.
        # TOPIC 을 실제로 읽는 곳은 config.customTopic → 대본 생성 하나뿐이라
        # 이 스텝에만 두면 덤프가 1회로 줄고 나머지 스텝 로그가 읽을 수 있게 된다.
        env:
          TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}

      # ★뒤 단계는 브리프가 신선할 때만 돈다★ 대본 스텝이 skip=true 를 내면 그날은
      # 시세가 낡았거나 날짜가 어긋난 것이라, 여기서 멈추지 않으면 어제 값으로 만든 종목
      # 추천이 오늘 것으로 올라가고 다음 날 그걸 채점까지 한다.
      # (실패가 아니라 정상적인 건너뛰기라 잡은 초록으로 끝난다 — 진짜 고장과 구별되게.)
      - name: 나레이션 생성
        if: steps.script.outputs.skip != 'true'
        run: npm run generate:voice

      - name: 렌더링
        if: steps.script.outputs.skip != 'true'
        run: npm run render

      - name: 유튜브 업로드
        if: steps.script.outputs.skip != 'true'
        run: npm run upload

      - name: 산출물 업로드(디버그용 아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: |
            out/video.mp4
            out/thumbnail.jpg
            out/script.json
            out/manifest.json
            out/deck.json
            out/deck-meta.json
            out/upload-result.json
            out/usage.json
          if-no-files-found: ignore
          retention-days: 7

      # ── 업로드 전 리뷰 흐름 ── 결과(videoId·공개상태)를 아티팩트 "이름"에 인코딩해
      # 웹앱이 zip 다운로드 없이 목록 조회만으로 미리보기(임베드)·발행 버튼을 띄우게 한다.
      # 사용량을 아티팩트 "이름"에 인코딩해 웹앱이 zip 없이 목록만으로 누적 집계하게 한다.
      # (결과 아티팩트와 같은 방식 — 서버리스에서 파일을 풀지 않고 합계를 낼 수 있다.)
      - name: 사용량 집계
        id: usage
        if: always()
        run: |
          if [ -f out/usage.json ]; then
            jq -r 'def s(k; f): ([.[] | select(.kind==k) | (f // 0)] | add // 0);
              "ci=\(s("claude"; .inputTokens))",
              "co=\(s("claude"; .outputTokens))",
              "oi=\(s("openai-text"; .inputTokens))",
              "oo=\(s("openai-text"; .outputTokens))",
              "img=\(s("openai-image"; .images))",
              "gimg=\(s("gemini-image"; .images))",
              "tts=\(s("elevenlabs"; .chars))"' out/usage.json >> "$GITHUB_OUTPUT" || echo "has=0" >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
            echo "── 이번 실행 사용량 ──"; cat out/usage.json | jq -c 'group_by(.kind)[] | {kind: .[0].kind, n: length}'
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi
          # ★B롤 컷 수는 반드시 여기서 찍는다★
          # 파이프라인 안(printUsage)에서도 찍지만, 그 줄은 로그 끝에서 수백 줄 위라
          # 실제로는 꺼내 볼 수가 없었다(env 덤프가 로그 꼬리를 다 채운다).
          # 이 단계는 로그 맨 끝이라 항상 보이고, 아티팩트 이름에도 남아 목록만으로 확인된다.
          if [ -f out/manifest.json ]; then
            BR=$(jq -r '[.scenes[]?.broll // [] | length] | add // 0' out/manifest.json)
            SC=$(jq -r '[.scenes[]? | select((.broll // []) | length > 0)] | length' out/manifest.json)
            TOT=$(jq -r '.scenes | length' out/manifest.json)
            echo "br=$BR" >> "$GITHUB_OUTPUT"
            echo "── B롤 ── ${BR}컷 / ${SC}개 씬 (전체 ${TOT}개 씬)"
            # 도식(등각 다이어그램·비교) 씬 수 — Footage.tsx 의 hasFigure() 와 같은 조건이다.
            # B롤과 같은 이유로 여기서 찍는다: 실사 위에 우리 그림이 실제로 올라갔는지는
            # 완성 영상을 다 보기 전에는 알 수 없는데, 이 숫자면 목록에서 바로 읽힌다.
            FIG=$(jq -r '[.scenes[]? | select((.visual == "diagram" and ((.diagram.nodes // []) | length) > 0) or (.visual == "comparison" and .comparison != null) or (.visual == "metric" and (.metric.value // "") != "") or (.visual == "bars" and ((.bars.items // []) | length) > 0))] | length' out/manifest.json)
            echo "fig=$FIG" >> "$GITHUB_OUTPUT"
            # 종류별 내역도 찍는다 — 총 개수만으로는 "diagram 만 반복"인지 알 수 없다.
            # ★FIG 과 같은 유효성 조건을 쓴다★ 예전엔 여기만 .visual 값으로 세서,
            # 내용이 빈 씬이 내역에는 잡히고 FIG 에는 안 잡혀 합이 안 맞았다.
            KINDS=$(jq -r '
              def ok: (.visual == "diagram" and ((.diagram.nodes // []) | length) > 0)
                   or (.visual == "comparison" and .comparison != null)
                   or (.visual == "metric" and (.metric.value // "") != "")
                   or (.visual == "bars" and ((.bars.items // []) | length) > 0);
              [.scenes[]? | select(ok) | .visual] | group_by(.) | map("\(.[0]):\(length)") | join(" / ")
            ' out/manifest.json)
            echo "── 도식 ── ${FIG}개 씬  ${KINDS}"
            # ★내역을 아티팩트 이름에도 넣는다★
            # 로그와 잡 요약에만 두면 실행 페이지를 눈으로 열어야만 읽힌다. 아티팩트
            # 이름은 API 목록만으로 보여서, 지난 회차들의 도식 편중을 한눈에 비교할 수 있다.
            # (이름에는 ':' '/' 를 못 쓰므로 dg/cp/mt/bs 약어에 개수를 붙인 형태로 만든다.)
            KSLUG=$(jq -r '
              def ok: (.visual == "diagram" and ((.diagram.nodes // []) | length) > 0)
                   or (.visual == "comparison" and .comparison != null)
                   or (.visual == "metric" and (.metric.value // "") != "")
                   or (.visual == "bars" and ((.bars.items // []) | length) > 0);
              [.scenes[]? | select(ok) | .visual] as $v
              | "dg\($v | map(select(. == "diagram")) | length)"
              + "-cp\($v | map(select(. == "comparison")) | length)"
              + "-mt\($v | map(select(. == "metric")) | length)"
              + "-bs\($v | map(select(. == "bars")) | length)"
            ' out/manifest.json)
            echo "kslug=$KSLUG" >> "$GITHUB_OUTPUT"
            # ★잡 요약에도 남긴다★
            # 이 줄은 로그에 찍히지만 바로 뒤에 오는 환경변수 덤프가 로그 꼬리를 다 채워서
            # 실제로는 찾아 읽기가 어렵다(B롤 때와 같은 문제다). 요약에 두면 실행 페이지 맨
            # 위에서 바로 보인다.
            {
              echo "### 이번 영상"
              echo ""
              echo "- 실사 B롤: **${BR}컷** / ${SC}개 씬 (전체 ${TOT}개 씬)"
              echo "- 도식: **${FIG}개** — ${KINDS:-없음}"
            } >> "$GITHUB_STEP_SUMMARY"
            # ★if 로 써야 한다★ 이 스텝은 `bash -e` 로 돌고, 스크립트의 마지막 명령이
            # `[ ... ] && echo ...` 이면 조건이 거짓일 때 종료코드 1 이 되어 스텝이 실패한다.
            # 실제로 그렇게 터졌다 — 영상은 멀쩡히 다 만들어졌는데 집계 단계만 빨간불이 났다.
            if [ "$BR" = "0" ]; then
              echo "⚠ 실사 컷이 하나도 안 들어갔습니다 — PEXELS_API_KEY 또는 illustration 필드를 확인하세요"
            fi
          else
            echo "br=0" >> "$GITHUB_OUTPUT"
            echo "fig=0" >> "$GITHUB_OUTPUT"
            echo "kslug=none" >> "$GITHUB_OUTPUT"
          fi

      - name: 사용량 아티팩트
        if: always() && steps.usage.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: usage__ci-${{ steps.usage.outputs.ci }}__co-${{ steps.usage.outputs.co }}__oi-${{ steps.usage.outputs.oi }}__oo-${{ steps.usage.outputs.oo }}__img-${{ steps.usage.outputs.img }}__gimg-${{ steps.usage.outputs.gimg }}__tts-${{ steps.usage.outputs.tts }}__br-${{ steps.usage.outputs.br }}__fig-${{ steps.usage.outputs.fig }}__k-${{ steps.usage.outputs.kslug }}
          path: out/usage.json
          retention-days: 90

      - name: 업로드 결과 파싱
        id: result
        if: always()
        run: |
          if [ -f out/upload-result.json ]; then
            echo "vid=$(jq -r .videoId out/upload-result.json)" >> "$GITHUB_OUTPUT"
            echo "pv=$(jq -r .privacyStatus out/upload-result.json)" >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 리뷰용 결과 아티팩트
        if: always() && steps.result.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: result__vid-${{ steps.result.outputs.vid }}__pv-${{ steps.result.outputs.pv }}
          path: out/upload-result.json
          if-no-files-found: ignore
          retention-days: 7
