name: 매일 AI 영상 자동 발행

on:
  # 자동 스케줄 발행은 끔 — 사용자가 사이트에서 직접 넣을 때만 만든다.
  # (매일 07:00 KST 로 돌면서 비공개 영상이 계속 쌓이고 비용이 나갔다.)
  # 다시 켜려면 아래 두 줄의 주석을 풀면 된다:
  #   schedule:
  #     - cron: '0 22 * * *'   # 22:00 UTC = 다음날 07:00 KST
  workflow_dispatch:
    inputs:
      topic:
        description: '영상 주제 (비우면 모드에 따라 자동 선택)'
        required: false
        default: ''
      content_mode:
        description: '주제 모드 (auto | trend | basics)'
        required: false
        default: 'auto'
      content_level:
        description: '대본 난이도 (basic | intermediate | expert)'
        required: false
        default: 'expert'
      do_upload:
        description: '유튜브 업로드 여부 (true | false)'
        required: false
        default: 'true'
      channel:
        description: '업로드 채널 (default | ch2)'
        required: false
        default: 'default'
      privacy:
        description: '공개 상태 (public | unlisted | private). 리뷰 흐름은 unlisted 로 올려 확인 후 발행.'
        required: false
        default: ''
      style:
        description: '영상 스타일 (illustrated=2D 벡터 | scrapbook=빈티지 판화 스크랩북 | deck3d=3D 기하학 | signal=데이터 중심 | signal3d=시그널+3D)'
        required: false
        default: ''
  # 웹앱/외부에서 트리거 (client_payload 로 topic 전달)
  repository_dispatch:
    types: [publish-video]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 파이프라인 단계별 스텝이 공유하는 환경변수 (웹앱 진행바가 스텝을 읽을 수 있도록 4단계로 분리)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      # 음성ID는 Variables/Secrets 어느 쪽에 넣어도 잡히게 둘 다 본다.
      # (키는 secrets 에, 음성ID는 vars 에서만 읽고 있어서 시크릿에 넣은 값이 무시되던 문제)
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || secrets.ELEVENLABS_MODEL_ID || 'eleven_multilingual_v2' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # 공개 상태: 리뷰 흐름은 웹앱이 unlisted 로 전달 → 확인 후 발행(public)으로 전환. 스케줄은 vars 기본값.
      YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || github.event.client_payload.opts.privacy || github.event.client_payload.privacy || vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '27' }}
      YOUTUBE_DESC_FOOTER: ${{ vars.YOUTUBE_DESC_FOOTER || 'AX전환은 CDSA와 함께\nhttps://cdsa.kr' }}
      # ── 두 번째 채널(ch2) 자격증명 — TARGET_CHANNEL=ch2 일 때 사용. 새 채널 OAuth 후 아래 시크릿을 등록. ──
      # (client id/secret 은 같은 OAuth 앱을 공유하면 위 기본값으로 폴백되므로 refresh token 만 필수)
      YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
      YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
      YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
      YOUTUBE_CATEGORY_ID_CH2: ${{ vars.YOUTUBE_CATEGORY_ID_CH2 }}
      YOUTUBE_DESC_FOOTER_CH2: ${{ vars.YOUTUBE_DESC_FOOTER_CH2 }}
      YOUTUBE_PRIVACY_STATUS_CH2: ${{ vars.YOUTUBE_PRIVACY_STATUS_CH2 }}
      # 업로드 대상 채널 선택 (default | ch2). 웹앱/수동 실행에서 전달.
      TARGET_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || 'default' }}
      # 합성 콘텐츠 공개 표시 — 목소리 클론 나레이션 + 비실사 일러스트는 YouTube 명시적 예외 대상이라 기본 false.
      SYNTHETIC_MEDIA_DISCLOSURE: ${{ vars.SYNTHETIC_MEDIA_DISCLOSURE || 'false' }}
      TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic || '' }}
      CONTENT_MODE: ${{ github.event.inputs.content_mode || github.event.client_payload.content_mode || vars.CONTENT_MODE || 'auto' }}
      # 대본 난이도/전문성: basic | intermediate | expert. 기본 expert(전문가용).
      CONTENT_LEVEL: ${{ github.event.inputs.content_level || github.event.client_payload.content_level || vars.CONTENT_LEVEL || 'expert' }}
      TARGET_MINUTES: ${{ github.event.client_payload.target_minutes || vars.TARGET_MINUTES || '10' }}
      CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE || 'ko' }}
      # 나레이션 배속(1=원속). 조금 빠르게 읽어 정보 밀도를 높인다.
      NARRATION_SPEED: ${{ github.event.client_payload.opts.speed || github.event.client_payload.speed || vars.NARRATION_SPEED || '1.12' }}
      DO_UPLOAD: ${{ github.event.inputs.do_upload || github.event.client_payload.do_upload || 'true' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      OPENAI_ILLUSTRATION_MODEL: ${{ vars.OPENAI_ILLUSTRATION_MODEL || 'gpt-image-1-mini' }}
      # 대본 전 최신정보 웹서치 담당: openai(기본, 저비용) | anthropic(Claude 웹서치 폴백).
      RESEARCH_PROVIDER: ${{ vars.RESEARCH_PROVIDER || 'openai' }}
      OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-4.1-mini' }}
      PRESENTER_IMAGE_URL: ${{ secrets.PRESENTER_IMAGE_URL || vars.PRESENTER_IMAGE_URL || '' }}
      THUMBNAIL_TONE: ${{ vars.THUMBNAIL_TONE || 'dark' }}
      # 썸네일 스타일(배경·글씨체·액센트 한 벌). auto 면 회차마다 회전.
      THUMBNAIL_STYLE: ${{ github.event.client_payload.opts.thumb_style || vars.THUMBNAIL_STYLE || 'chalk' }}
      # 영상 엔진: illustrated(AI 흑백 일러스트) | web3d(3D 웹녹화) | remotion(손그림). 기본 illustrated.
      VIDEO_ENGINE: ${{ github.event.inputs.style || github.event.client_payload.opts.style || github.event.client_payload.style || vars.VIDEO_ENGINE || 'illustrated' }}
      # 씬 일러스트 화풍(src/lib/artStyle.ts). 'auto' 는 회차마다 날짜 기준으로 회전.
      # 기본은 isometric — 지정이 없을 때 기존 채널 그림체가 유지되도록.
      ART_STYLE: ${{ github.event.client_payload.opts.art_style || github.event.client_payload.art_style || vars.ART_STYLE || 'isometric' }}
      # 나레이션 말투(src/lib/tone.ts): documentary | humorous | storytelling | mystery
      NARRATION_TONE: ${{ github.event.client_payload.opts.narration_tone || github.event.client_payload.narration_tone || vars.NARRATION_TONE || 'documentary' }}
      # 이미지 생성 provider: openai | gemini(Nano Banana — 회화적 화풍에 강하고 장당 더 저렴).
      # GEMINI_API_KEY 가 없으면 gemini 로 설정해도 일러스트 생성이 건너뛰어지므로 기본은 openai.
      IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'openai' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
      # Pexels 스톡 영상 B롤 — 한 화면이 15~20초씩 정지해 프리젠테이션처럼 보이던 것을
      # 2.5~4초 인서트 컷으로 끊는다. 키가 없으면 B롤 없이 기존대로 렌더된다.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 한국어 폰트 & Chromium 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-nanum fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2
          sudo fc-cache -f

      - name: 의존성 설치
        run: npm ci

      - name: Remotion 브라우저 준비
        run: npx remotion browser ensure

      - name: Playwright 브라우저 준비 (3D 웹녹화용)
        run: npx playwright install --with-deps chromium

      # ── 여기부터 4단계: 웹앱 진행바가 이 스텝 이름으로 진행도를 표시 ──
      - name: 대본 생성
        run: npm run generate:script

      - name: 나레이션 생성
        run: npm run generate:voice

      - name: 렌더링
        run: npm run render

      - name: 유튜브 업로드
        run: npm run upload

      - name: 산출물 업로드(디버그용 아티팩트)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: |
            out/video.mp4
            out/thumbnail.png
            out/script.json
            out/manifest.json
            out/deck.json
            out/deck-meta.json
            out/upload-result.json
            out/usage.json
          if-no-files-found: ignore
          retention-days: 7

      # ── 업로드 전 리뷰 흐름 ── 결과(videoId·공개상태)를 아티팩트 "이름"에 인코딩해
      # 웹앱이 zip 다운로드 없이 목록 조회만으로 미리보기(임베드)·발행 버튼을 띄우게 한다.
      # 사용량을 아티팩트 "이름"에 인코딩해 웹앱이 zip 없이 목록만으로 누적 집계하게 한다.
      # (결과 아티팩트와 같은 방식 — 서버리스에서 파일을 풀지 않고 합계를 낼 수 있다.)
      - name: 사용량 집계
        id: usage
        if: always()
        run: |
          if [ -f out/usage.json ]; then
            jq -r 'def s(k; f): ([.[] | select(.kind==k) | (f // 0)] | add // 0);
              "ci=\(s("claude"; .inputTokens))",
              "co=\(s("claude"; .outputTokens))",
              "oi=\(s("openai-text"; .inputTokens))",
              "oo=\(s("openai-text"; .outputTokens))",
              "img=\(s("openai-image"; .images))",
              "gimg=\(s("gemini-image"; .images))",
              "tts=\(s("elevenlabs"; .chars))"' out/usage.json >> "$GITHUB_OUTPUT" || echo "has=0" >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
            echo "── 이번 실행 사용량 ──"; cat out/usage.json | jq -c 'group_by(.kind)[] | {kind: .[0].kind, n: length}'
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 사용량 아티팩트
        if: always() && steps.usage.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: usage__ci-${{ steps.usage.outputs.ci }}__co-${{ steps.usage.outputs.co }}__oi-${{ steps.usage.outputs.oi }}__oo-${{ steps.usage.outputs.oo }}__img-${{ steps.usage.outputs.img }}__gimg-${{ steps.usage.outputs.gimg }}__tts-${{ steps.usage.outputs.tts }}
          path: out/usage.json
          retention-days: 90

      - name: 업로드 결과 파싱
        id: result
        if: always()
        run: |
          if [ -f out/upload-result.json ]; then
            echo "vid=$(jq -r .videoId out/upload-result.json)" >> "$GITHUB_OUTPUT"
            echo "pv=$(jq -r .privacyStatus out/upload-result.json)" >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 리뷰용 결과 아티팩트
        if: always() && steps.result.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: result__vid-${{ steps.result.outputs.vid }}__pv-${{ steps.result.outputs.pv }}
          path: out/upload-result.json
          if-no-files-found: ignore
          retention-days: 7
