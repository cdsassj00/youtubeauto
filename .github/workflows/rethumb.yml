name: 썸네일만 재생성/교체

on:
  # 웹앱에서 트리거 (client_payload 로 대상 videoId/제목/주제/후킹문구 전달)
  repository_dispatch:
    types: [rethumb-video]
  # 수동 실행 — 문구/배지만 바꿔가며 썸네일을 튜닝할 때.
  workflow_dispatch:
    inputs:
      video_id:
        description: '대상 videoId'
        required: true
      headline:
        description: '썸네일 문구 (8~14자, 짧고 세게)'
        required: false
        default: ''
      badge:
        description: '구석 배지 (제품·회사명, 예: Claude Opus 5)'
        required: false
        default: ''
      icons:
        description: "제품 심볼 한 줄 (예: ChatGPT, Claude, Gemini, Grok)"
        required: false
        default: ''
      topic:
        description: '주제(그림 소재 판단용)'
        required: false
        default: ''
      title:
        description: '영상 제목'
        required: false
        default: ''
      dramatic:
        description: '파격 모드 (true | false)'
        required: false
        default: 'true'

jobs:
  rethumb:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      PRESENTER_IMAGE_URL: ${{ secrets.PRESENTER_IMAGE_URL || vars.PRESENTER_IMAGE_URL || '' }}
      THUMBNAIL_TONE: ${{ vars.THUMBNAIL_TONE || 'dark' }}
      RETHUMB_VIDEO_ID: ${{ github.event.inputs.video_id || github.event.client_payload.video_id }}
      RETHUMB_TITLE: ${{ github.event.inputs.title || github.event.client_payload.title }}
      RETHUMB_TOPIC: ${{ github.event.inputs.topic || github.event.client_payload.topic }}
      RETHUMB_HEADLINE: ${{ github.event.inputs.headline || github.event.client_payload.headline }}
      # 주체 배지(제품·회사명) — 문구를 짧게 쓰는 대신 구석에 작게 박아 "무슨 영상인지"를 남긴다.
      RETHUMB_BADGE: ${{ github.event.inputs.badge || github.event.client_payload.badge }}
      # 여러 제품을 함께 다루는 회차 — 이름 대신 심볼을 한 줄로 (예: 'ChatGPT, Claude, Gemini, Grok')
      RETHUMB_ICONS: ${{ github.event.inputs.icons || github.event.client_payload.icons }}
      RETHUMB_DRAMATIC: ${{ github.event.inputs.dramatic || github.event.client_payload.dramatic }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 썸네일 재생성 + 교체
        run: npm run rethumb

      # 썸네일만 다시 만드는 실행도 이미지 비용이 든다 — 누적 집계에 포함시킨다.
      - name: 사용량 집계
        id: usage
        if: always()
        run: |
          if [ -f out/usage.json ]; then
            jq -r 'def s(k; f): ([.[] | select(.kind==k) | (f // 0)] | add // 0);
              "img=\(s("openai-image"; .images))"' out/usage.json >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 사용량 아티팩트
        if: always() && steps.usage.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: usage__ci-0__co-0__oi-0__oo-0__img-${{ steps.usage.outputs.img }}__tts-0
          path: out/usage.json
          retention-days: 90
