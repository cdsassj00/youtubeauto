name: 강의 시리즈 매일 한 편

# 드라이브에 올려둔 강의를 순번대로 하루에 한 편씩 올린다.
#
# ★무엇을 올릴지 스스로 정한다★ assets/course/manifest.json 의 순번 목록과, 유튜브 채널에
# 이미 올라간 회차를 대조해 "아직 안 올라간 것 중 가장 빠른 순번"을 집는다. 진행 상태를
# 저장소에 적어 두지 않으므로 두 곳이 어긋날 일이 없다 — 유튜브가 사실이다.
#
# ★올릴 게 없으면 조용히 끝난다★ 목록을 다 쓰면 아무것도 안 하고 성공으로 끝낸다.
# 실패로 처리하면 매일 빨간 알림이 오는데, 남은 파일이 없는 것은 고장이 아니다.
on:
  schedule:
    # 매일 09:00 KST (UTC 00:00). 아침에 올라가 있게.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '예행 모드 (true=메타데이터만 만들고 업로드 안 함)'
        required: false
        default: 'false'
      privacy:
        description: '공개 상태 (public | unlisted | private)'
        required: false
        default: 'public'

# 두 개가 겹쳐 돌면 같은 회차를 두 번 올릴 수 있다. 하나씩만 돌린다.
concurrency:
  group: course-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ★멈춤 스위치★ 저장소 변수 COURSE_DAILY_ENABLED 를 'false' 로 두면 크론이 건너뛴다.
    # (Actions 화면에서 워크플로를 통째로 비활성화해도 된다.)
    if: vars.COURSE_DAILY_ENABLED != 'false'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TARGET_CHANNEL: default
      YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
      YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID || '27' }}
      YOUTUBE_DESC_FOOTER: ${{ vars.YOUTUBE_DESC_FOOTER || 'AX전환은 CDSA와 함께\nhttps://cdsa.kr' }}
      # 사람이 직접 찍고 편집한 강의라 합성 미디어 표시 대상이 아니다.
      SYNTHETIC_MEDIA_DISCLOSURE: 'false'
      THUMBNAIL_STYLE: ${{ vars.COURSE_THUMBNAIL_STYLE || 'impact' }}
      COURSE_NAME: ${{ vars.COURSE_NAME || 'AI챔피언 강사양성과정' }}
      SERIES_TITLE: ${{ vars.COURSE_SERIES_TITLE || 'AI챔피언 강사양성과정' }}
      COURSE_HOOK: ${{ vars.COURSE_HOOK || '돈 주고도 못 듣는 강의' }}
      COURSE_HOOK_SUB: ${{ vars.COURSE_HOOK_SUB || '무조건 구독 · 소장' }}
      PLAYLIST_TITLE: ${{ vars.COURSE_PLAYLIST_TITLE || 'AI챔피언 강사양성과정' }}
      # 이 워크플로의 핵심 — 올릴 회차를 스스로 고른다.
      COURSE_AUTO: 'true'
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 한글 폰트가 없으면 썸네일 시리즈 띠가 에러 없이 두부(□□□)로 나온다.
      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 오늘 한 편 올리기
        run: npx tsx src/pipeline/course.ts

      - name: 결과 요약
        if: always()
        run: |
          if [ -f out/upload-result.json ]; then
            echo "## 오늘 올라간 영상" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat out/upload-result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "## 오늘은 올린 영상이 없습니다 (남은 회차 없음 또는 예행 모드)" >> $GITHUB_STEP_SUMMARY
          fi

      # 영상 파일은 수백 MB 라 넣지 않는다. 사람이 확인할 것은 메타데이터와 썸네일뿐이다.
      - name: 메타데이터 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-daily
          path: |
            out/course-meta.json
            out/upload-result.json
            out/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 14
