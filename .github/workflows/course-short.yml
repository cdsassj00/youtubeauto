name: 강의 쇼츠 만들기

# ★새로 찍지 않는다★ 강의가 일흔 편 넘게 쌓여 있고 자막까지 붙어 있다. 거기서 사람들이
# 남에게 옮길 만한 한 토막을 잘라 세로로 만든다. 쇼츠는 그 자체로도 보지만, 전체 강의로
# 가는 길이기도 하다.
#
# ★훅은 지어내지 않고 고른다★ assets/shorts/hooks.json 에 틀 50가지를 두고, 모델은 그중
# 내용에 맞는 것을 골라 대괄호를 자막에서 읽은 실제 값으로 채운다. 빈 화면에서 문구를
# 쓰게 하면 "AI 활용법!" 같은 말이 나온다 — 고르게 하면 구조가 남는다.
#
# ★기본이 예행 모드다★ 올리지 않고 만들기만 해서 아티팩트로 내려 준다. 훅과 자른 자리가
# 쓸 만한지 먼저 눈으로 보고 결정한다.
#
# 드는 쿼터: 업로드 1,600(예행 모드는 0). 렌더는 ffmpeg 라 비용이 없고, 모델은 한 번 부른다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '예행 모드 (true=만들기만 / false=올리기까지)'
        required: false
        default: 'true'
      series:
        description: '시리즈 표식 (cdsa-agent | cdsa-ac | cdsa-leader)'
        required: false
        default: 'cdsa-agent'
      order:
        description: '특정 회차로 만들 때만. 비우면 아직 안 만든 회차부터'
        required: false
        default: ''
      privacy:
        description: '공개 범위 (public | unlisted | private)'
        required: false
        default: 'public'
      max_sec:
        description: '쇼츠 길이 상한(초). 짧을수록 끝까지 본다'
        required: false
        default: '55'

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # 강의 시리즈는 기본 채널이다. 비워 두면 다른 채널을 읽는다.
      TARGET_CHANNEL: default
      YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
      YOUTUBE_DESC_FOOTER: ${{ vars.YOUTUBE_DESC_FOOTER || 'AX전환은 CDSA와 함께\nhttps://cdsa.kr' }}
      COURSE_ONLY: ${{ github.event.inputs.series || 'cdsa-agent' }}
      SHORT_ORDER: ${{ github.event.inputs.order || '' }}
      SHORT_MAX_SEC: ${{ github.event.inputs.max_sec || '55' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      # ★자막을 영상에 구워 넣는다★ 러너에 한국어 글꼴이 없으면 글자가 전부 네모로 나온다.
      - name: 한국어 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk
          sudo fc-cache -f
      - name: 의존성 설치
        run: npm ci
      - name: 쇼츠 만들기
        run: npx tsx src/pipeline/courseShort.ts 2>&1 | tee out-short.log
      - name: 요약
        if: always()
        run: |
          {
            echo '## 강의 쇼츠'
            echo ''
            echo '```'
            cat out-short.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 만든 영상
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-short
          path: out/short/short.mp4
          if-no-files-found: ignore
          retention-days: 14
