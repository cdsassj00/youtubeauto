name: channel-check

# 업로드 대상 채널 점검 — 완전 무료다.
#
# config.ts 는 채널 전용 시크릿이 없으면 조용히 기본 채널로 폴백한다. 이름을 하나만 틀려도
# 경고 없이 1번 채널로 올라가고, 유료 영상을 다 만든 뒤에야 알게 된다. 이 워크플로는
# channels.list 를 한 번 부르고 끝난다(할당량 1 units, AI·TTS·렌더 없음).
#
# 결과 채널명을 잡 요약과 아티팩트 이름에 남겨서, 실행 목록만 봐도 어느 채널인지 읽힌다.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: '확인할 채널 (default | ch2)'
        required: false
        default: 'ch2'
  repository_dispatch:
    types: [channel-check]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || 'ch2' }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
      YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
      YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
      # config.ts 가 로드될 때 있어야 하는 값들 — 이 점검에는 쓰이지 않는다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 채널 확인
        id: ch
        run: npx tsx scripts/channel-check.ts

      - name: 요약
        if: always()
        run: |
          {
            echo "### 업로드 대상 채널"
            echo ""
            echo "- TARGET_CHANNEL: \`${TARGET_CHANNEL}\`"
            echo "- 채널명: **${{ steps.ch.outputs.title || '(확인 실패)' }}**"
            echo "- 핸들: ${{ steps.ch.outputs.handle || '-' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 실행 목록에서 결과가 바로 읽히도록 채널명을 아티팩트 이름에 남긴다.
      # (B롤 컷 수를 __br-N 으로 남긴 것과 같은 이유다 — 로그를 열지 않고 확인하려는 것.)
      - name: 결과 표식
        if: always() && steps.ch.outputs.title != ''
        run: echo "${{ steps.ch.outputs.title }}" > channel.txt
      - name: 결과 아티팩트
        if: always() && steps.ch.outputs.title != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel__${{ steps.ch.outputs.title }}
          path: channel.txt
          retention-days: 7
