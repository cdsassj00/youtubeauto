name: 강의 중복 회차 정리

# 같은 회차가 여러 번 올라간 것을 치운다.
#
# ★왜 생겼나★ 한 번에 여러 편 올리도록 바꾸면서, 방금 올린 영상이 유튜브 업로드 목록에
# 아직 안 뜨는 시차를 못 메웠다. 40번을 올리고 몇 초 뒤 "이미 올라간 회차: …, 39" 라는
# 답을 받아 40번을 또 집었다. 원인은 코드에서 막았고(course.ts 의 justPublished),
# 이 워크플로는 이미 생긴 것을 치운다.
#
# ★먼저 올린 것을 남긴다★ 조회수·시청 시간이 쌓여 있고 링크가 돌아다녔을 수 있다.
# ★기본은 비공개다★ 지우면 되돌릴 수 없다. 정말 지우려면 action=delete 로 지시한다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '예행 모드 (true=보기만 / false=실제 반영)'
        required: false
        default: 'true'
      action:
        description: '중복본 처리 — private(비공개, 되돌릴 수 있음) | delete(삭제, 되돌릴 수 없음)'
        required: false
        default: 'private'
      series:
        description: '시리즈 표식 (cdsa-ac | cdsa-leader)'
        required: false
        default: 'cdsa-ac'

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # 강의 시리즈는 기본 채널이다. 비워 두면 다른 채널을 읽는다.
      TARGET_CHANNEL: default
      COURSE_CODE: ${{ github.event.inputs.series || 'cdsa-ac' }}
      ACTION: ${{ github.event.inputs.action || 'private' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: 의존성 설치
        run: npm ci
      - name: 중복 정리
        run: npx tsx src/pipeline/courseDedup.ts 2>&1 | tee out-dedup.log
      - name: 요약
        if: always()
        run: |
          {
            echo '## 중복 회차 정리'
            echo ''
            echo '```'
            sed -n '/올라간 영상/,$p' out-dedup.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
