name: cutout-sheet

# 컷아웃 판화 견본 — VOX 스타일 엔진을 만들기 전에 그림이 쓸 만한지부터 확인한다.
# 영상 렌더/업로드가 없어 몇 분 안에 끝나고, 비용도 이미지 장수만큼만 든다.
# Gemini 배선(GEMINI_API_KEY / IMAGE_PROVIDER) 점검도 겸한다.
on:
  repository_dispatch:
    types: [cutout-sheet]
  workflow_dispatch:
    inputs:
      styles:
        description: '쉼표로 구분한 소재 id (비우면 전체). 예: datacenter,engineer'
        required: false
        default: ''
      provider:
        description: '이미지 provider (openai | gemini). 비우면 저장소 기본값'
        required: false
        default: ''

jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 대본을 만들지 않으므로 Claude/TTS 키는 필요 없다. 이미지 관련만 넘긴다.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ILLUSTRATION_MODEL: ${{ vars.OPENAI_ILLUSTRATION_MODEL || 'gpt-image-1-mini' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
      IMAGE_PROVIDER: ${{ github.event.inputs.provider || github.event.client_payload.provider || vars.IMAGE_PROVIDER || 'openai' }}
      # config.ts 가 로드될 때 있어야 하는 값들 — 견본 생성에는 쓰이지 않는다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 비교표의 화풍 이름을 sharp 가 SVG 텍스트로 그리는데, 러너에 한글 폰트가 없으면
      # 전부 두부(□□□)로 나온다. 실제로 첫 실행에서 그렇게 깨졌다.
      - name: 한국어 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 의존성 설치
        run: npm ci

      - name: 키 배선 확인
        run: |
          echo "IMAGE_PROVIDER = $IMAGE_PROVIDER"
          # 값은 절대 출력하지 않는다 — 있는지 없는지만 본다.
          if [ -n "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY  = 있음 (${#GEMINI_API_KEY}자)"; else echo "GEMINI_API_KEY  = 없음"; fi
          if [ -n "$OPENAI_API_KEY" ]; then echo "OPENAI_API_KEY  = 있음 (${#OPENAI_API_KEY}자)"; else echo "OPENAI_API_KEY  = 없음"; fi

      - name: 컷아웃 생성
        run: npx tsx scripts/cutout-sheet.ts "${{ github.event.inputs.styles || github.event.client_payload.styles }}"

      # 견본도 실제로 돈이 나가므로 누적 비용에 잡혀야 한다.
      # (첫 실행 때 이 단계가 없어서 이미지 7장이 집계에서 통째로 빠졌다.)
      # 이름 규칙은 daily-publish.yml 과 같아야 cost.js 가 같이 읽는다.
      - name: 사용량 집계
        id: usage
        if: always()
        run: |
          if [ -f out/usage.json ]; then
            jq -r 'def s(k; f): ([.[] | select(.kind==k) | (f // 0)] | add // 0);
              "img=\(s("openai-image"; .images))",
              "gimg=\(s("gemini-image"; .images))"' out/usage.json >> "$GITHUB_OUTPUT" || echo "has=0" >> "$GITHUB_OUTPUT"
            echo "has=1" >> "$GITHUB_OUTPUT"
          else
            echo "has=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 사용량 아티팩트
        if: always() && steps.usage.outputs.has == '1'
        uses: actions/upload-artifact@v4
        with:
          name: usage__ci-0__co-0__oi-0__oo-0__img-${{ steps.usage.outputs.img }}__gimg-${{ steps.usage.outputs.gimg }}__tts-0
          path: out/usage.json
          retention-days: 90

      - name: 컷아웃 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutout-sheet
          path: out/cutout
          retention-days: 30
