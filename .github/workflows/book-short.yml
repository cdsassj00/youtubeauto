name: 책 문장 쇼츠 만들기

# ★책 한 문장으로 세로 쇼츠 한 편★ assets/shorts/books.json 에 책과 문장을 적어 두면
# 위에서부터 한 편씩 만든다. 훅은 hooks.json 의 틀 50가지 중에서 고른다.
#
# ★인용은 짧게★ 책 문장은 적어 둔 한두 줄만 그대로 쓰고, 앞뒤는 "그래서 뭐가 달라지는가"를
# 우리 말로 채운다. 길게 옮기면 인용이 아니라 복제다.
#
# ★상품 태그는 여기서 못 단다★ 유튜브 데이터 API 에는 쇼핑 상품을 다는 길이 없다. 올리는
# 데까지가 이 워크플로의 몫이고, 책은 스튜디오에서 손으로 단다(로그가 안내한다).
# 쇼핑 기능 자체도 파트너 프로그램(구독자 1,000명 등) 조건을 채워야 보인다.
#
# ★기본이 예행 모드다★ 올리지 않고 만들어 아티팩트로 내려 준다.
#
# 드는 쿼터: 업로드 1,600(예행 모드는 0). 스톡은 Pexels 무료 API, 음악은 코드로 만든다.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '예행 모드 (true=만들기만 / false=올리기까지)'
        required: false
        default: 'true'
      book_id:
        description: '특정 책만 (books.json 의 id). 비우면 위에서부터'
        required: false
        default: ''
      count:
        description: '한 번에 몇 편'
        required: false
        default: '1'
      channel:
        description: '올릴 채널 (default | ch2)'
        required: false
        default: 'default'
      privacy:
        description: '공개 범위 (public | unlisted | private)'
        required: false
        default: 'public'
      backdrop:
        description: '배경 — auto(스톡 먼저, 없으면 코드로) | stock(스톡만) | code(코드로만)'
        required: false
        default: 'auto'
      backdrop_style:
        description: '코드로 그릴 때 결 — 비우면 컷마다 돌림 | sketch | vector | grid'
        required: false
        default: ''

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-4-8' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
      YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
      YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
      TARGET_CHANNEL: ${{ github.event.inputs.channel || 'default' }}
      YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || 'public' }}
      BOOK_ID: ${{ github.event.inputs.book_id || '' }}
      BOOK_BUDGET: ${{ github.event.inputs.count || '1' }}
      BACKDROP: ${{ github.event.inputs.backdrop || 'auto' }}
      BACKDROP_STYLE: ${{ github.event.inputs.backdrop_style || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      # ★글씨를 그림으로 굽는다★ 러너에 한국어 글꼴이 없으면 전부 네모로 나온다.
      - name: 한국어 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk
          sudo fc-cache -f
      - name: 의존성 설치
        run: npm ci
      - name: 쇼츠 만들기
        run: npx tsx src/pipeline/bookShort.ts 2>&1 | tee out-book.log
      - name: 요약
        if: always()
        run: |
          {
            echo '## 책 문장 쇼츠'
            echo ''
            echo '```'
            cat out-book.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 만든 영상
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book-short
          path: out/bookshort/short.mp4
          if-no-files-found: ignore
          retention-days: 14
