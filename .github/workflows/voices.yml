name: voices

# ElevenLabs 목소리 목록 조회 — 완전 무료다(합성하지 않으므로 문자 사용량 0).
#
# 나레이션 목소리는 ELEVENLABS_VOICE_ID 하나로 정해지는데 그 ID 는 ElevenLabs 계정 안에만
# 있다. 목소리를 새로 만들고 이름만 아는 상태에서는 어디에도 적을 수가 없어 거기서 막힌다.
# 이 워크플로를 돌리면 로그에 이름과 ID 가 나란히 찍힌다.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [voices]

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || secrets.ELEVENLABS_VOICE_ID }}
      # config.ts 가 로드될 때 있어야 하는 값들 — 이 조회에는 쓰이지 않는다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 목소리 목록
        run: npx tsx scripts/voices.ts
