name: stock-check

# 스톡 소스(Pexels·Pixabay·Unsplash) 키 점검 — 완전 무료다.
#
# 파이프라인은 키가 없거나 틀려도 조용히 B롤을 건너뛴다(B롤은 없어도 영상이 나와야 하므로
# 그렇게 설계했다). 그래서 키가 잘못돼 있으면 유료 영상을 한 편 다 뽑고 나서야 알게 된다.
# 이 워크플로는 검색만 6번 하고 끝난다 — 파일도 안 받고 AI 도 안 부른다.
on:
  repository_dispatch:
    types: [stock-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      # config.ts 가 로드될 때 있어야 하는 값들 — 이 점검에는 쓰이지 않는다.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Pexels 점검
        run: npx tsx scripts/stock-check.ts
