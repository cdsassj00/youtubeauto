name: 강의 중복 확인 (발행 전, 아무것도 바꾸지 않음)

# ★새 시리즈를 붙일 때마다 한 번 돌린다★ 중복 방지 장치는 자기 표식(태그 <코드>-<회차>)만
# 보므로, 시리즈를 새로 만들면 "올린 것 0편" 으로 읽고 1번부터 시작한다. 같은 강의를
# 예전에 다른 이름으로, 또는 손으로 올려 두었다면 그것은 보이지 않는다.
#
# ★막지 않고 알려 준다★ 제목이 닮았다고 발행을 멈추면 28번이 빠졌을 때처럼 시리즈가
# 조용히 선다. 같은 주제를 다른 과정에서 다시 찍는 것도 흔하다. 그래서 판정이 아니라
# 사람이 보고 결정할 목록이다.
#
# ★쿼터를 거의 쓰지 않는다★ 목록 읽기는 호출당 1 단위라 채널 전체를 훑어도 열몇 단위다.
# 업로드 한 편이 1,600 이니 발행 전에 몇 번이든 돌려도 그날 몫이 줄지 않는다.

on:
  workflow_dispatch:
    inputs:
      series:
        description: '볼 시리즈 표식 (cdsa-agent | cdsa-ac | cdsa-leader). 비우면 전부'
        required: false
        default: ''
      threshold:
        description: '닮았다고 볼 기준 (0.5 = 낱말 절반이 겹칠 때). 낮추면 더 많이 잡는다'
        required: false
        default: '0.5'

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # 강의 시리즈는 기본 채널이다. 비워 두면 다른 채널을 읽는다.
      TARGET_CHANNEL: default
      COURSE_ONLY: ${{ github.event.inputs.series || '' }}
      OVERLAP_THRESHOLD: ${{ github.event.inputs.threshold || '0.5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: 의존성 설치
        run: npm ci
      - name: 중복 확인
        run: npx tsx src/pipeline/courseOverlap.ts 2>&1 | tee out-overlap.log
      - name: 요약
        if: always()
        run: |
          {
            echo '## 발행 전 중복 확인'
            echo ''
            echo '```'
            cat out-overlap.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
