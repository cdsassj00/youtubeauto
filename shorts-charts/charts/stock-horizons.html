<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script src="lib.js"></script><script src="stock-data.js"></script><script>
// 주식 쇼츠 — 사이트 공식 추천(daily-brief 의 horizons) 네 구간을 30초에.
// 데이터는 scripts/stock-shorts.mjs 가 그날 응답으로 stock-data.js(window.STOCK)를 써 준다.
// 나레이션·AI 대본 없이 화면과 비트만 — 숫자는 응답에서 그대로 옮기고 계산하지 않는다.
// ★성적 숫자는 넣지 않는다★ 구간별 백테스트 수익률(track)·리그·적중률은 공개 콘텐츠에 쓰지 않는다.
const S = window.STOCK;
const BG0 = '#070c18', BG1 = '#0d1830', GOLD = '#d9a441', INK = '#f4f6fb', DIM = '#8b97b2', LINE = '#1f2b47';
const UP = '#ff5a5f', DOWN = '#4c8dff';          // 한국식: 오름 빨강 · 내림 파랑
const BUCKET_COLOR = { day: '#ff8a3d', swing: '#f2c94c', mid: '#3ddc97', long: '#5b9dff' };

const HOOK = 3.0, SEG = 6.0, OUTRO = 4.0;
const NB = S.buckets.length;
const segStart = (i) => HOOK + i * SEG;
const OUT0 = HOOK + NB * SEG;
const DUR = OUT0 + OUTRO;

// 반올림 없이 응답 값 그대로. 부호는 % 앞에.
const signPct = (v) => `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(2).replace(/\.?0+$/, '')}%`;

function background(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, 1920);
  g.addColorStop(0, BG1); g.addColorStop(1, BG0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
  // 아주 느린 격자 — 배경은 주인공이 아니므로 2% 이하로 움직인다
  ctx.save();
  ctx.strokeStyle = 'rgba(120,150,210,0.06)'; ctx.lineWidth = 1;
  const off = (t * 6) % 90;
  for (let y = -90 + off; y < 1920; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1080, y); ctx.stroke(); }
  ctx.restore();
}

// 고정 머리말 — 영상 내내 같은 자리
function header(ctx) {
  txt(ctx, 'STOCKONTOLOGY', 72, 150, { font: f(800, 30, NUM), color: GOLD, ls: 5 });
  txt(ctx, `${S.nextLabel} ${S.marketKo}장`, 72, 236, { font: f(900, 74), color: INK, ls: -2 });
  txt(ctx, `구간별로 볼 종목 · ${S.dataLabel}`, 72, 292, { font: f(600, 32), color: DIM });
}

// 구간 탭 — 지금 어느 구간인지(위치 표시, 움직임은 하이라이트만)
function tabs(ctx, active, a = 1) {
  const w = 222, gap = 14, x0 = 72, y = 336;
  S.buckets.forEach((b, i) => {
    const on = i === active;
    const col = BUCKET_COLOR[b.id] || GOLD;
    ctx.save();
    ctx.globalAlpha = a;
    rr(ctx, x0 + i * (w + gap), y, w, 64, 32);
    ctx.fillStyle = on ? col : 'rgba(255,255,255,0.06)';
    ctx.fill();
    ctx.restore();
    txt(ctx, b.nameKo, x0 + i * (w + gap) + w / 2, y + 44, { font: f(800, 32), color: on ? '#0b1020' : DIM, align: 'center', alpha: a });
  });
}

function card(ctx, p, i, x, y, a, dx, col) {
  const w = 936, h = 290;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(dx, 0);
  rr(ctx, x, y, w, h, 28);
  ctx.fillStyle = 'rgba(16,26,48,0.92)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = LINE; ctx.stroke();
  // 순위 띠
  rr(ctx, x, y, 12, h, 6); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
  const A = { alpha: a };
  const X = x + dx;
  txt(ctx, `${p.rank}`, X + 52, y + 96, { font: f(900, 64, NUM), color: col, ...A });
  txt(ctx, p.name, X + 112, y + 92, { font: f(800, p.name.length > 9 ? 50 : 58), color: INK, ls: -1, ...A });
  const sub = [p.ticker, p.sector, p.priceLabel].filter(Boolean).join(' · ');
  txt(ctx, sub, X + 114, y + 142, { font: f(600, 30), color: DIM, ...A });
  const subW = measure(ctx, sub + '  ', f(600, 30));
  txt(ctx, signPct(p.changePct), X + 114 + subW, y + 142, { font: f(700, 30, NUM), color: p.changePct > 0 ? UP : p.changePct < 0 ? DOWN : DIM, ...A });
  if (p.common) {
    const label = `${p.common}구간 공통`;
    const lw = measure(ctx, label, f(800, 24)) + 28;
    ctx.save(); ctx.globalAlpha = a; rr(ctx, X + w - lw - 120, y + 46, lw, 42, 21); ctx.fillStyle = 'rgba(217,164,65,0.16)'; ctx.fill(); ctx.restore();
    txt(ctx, label, X + w - lw / 2 - 120, y + 75, { font: f(800, 24), color: GOLD, align: 'center', ...A });
  }
  // 목표 · 손절 (오른쪽 버튼 줄 x>940 을 피해 왼쪽 두 칸에)
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = LINE; ctx.beginPath(); ctx.moveTo(X + 40, y + 176); ctx.lineTo(X + w - 40, y + 176); ctx.stroke(); ctx.restore();
  if (p.target) {
    txt(ctx, '목표', X + 52, y + 240, { font: f(700, 28), color: DIM, ...A });
    txt(ctx, p.target, X + 122, y + 240, { font: f(800, 38, NUM), color: UP, ...A });
    txt(ctx, signPct(p.targetPct), X + 122 + measure(ctx, p.target + ' ', f(800, 38, NUM)), y + 240, { font: f(700, 28, NUM), color: UP, ...A });
  } else {
    txt(ctx, '목표가 없음', X + 52, y + 240, { font: f(700, 30), color: DIM, ...A });
  }
  txt(ctx, p.trailing ? '추적손절' : '손절', X + 470, y + 240, { font: f(700, 28), color: DIM, ...A });
  const sx = X + 470 + measure(ctx, (p.trailing ? '추적손절' : '손절') + ' ', f(700, 28));
  txt(ctx, p.stop, sx, y + 240, { font: f(800, 38, NUM), color: DOWN, ...A });
  txt(ctx, signPct(p.stopPct), sx + measure(ctx, p.stop + ' ', f(800, 38, NUM)), y + 240, { font: f(700, 28, NUM), color: DOWN, ...A });
}

function bucketScene(ctx, t, i) {
  const b = S.buckets[i];
  const t0 = segStart(i), lt = t - t0;
  const col = BUCKET_COLOR[b.id] || GOLD;
  const out = E.outQuint(prog(lt, SEG - 0.3, SEG));          // 나가는 것은 들어오는 것보다 짧게
  // 구간 제목
  const ha = E.outQuint(prog(lt, 0, 0.45)) * (1 - out);
  txt(ctx, b.nameKo, 72, 520, { font: f(900, 96), color: col, alpha: ha, ls: -2 });
  txt(ctx, b.rule, 72 + measure(ctx, b.nameKo + '  ', f(900, 96)), 506, { font: f(700, 34), color: INK, alpha: ha });
  // 카드 셋 — 하나씩(0.25초 간격), 앞 것이 반쯤 들어왔을 때 다음
  b.picks.forEach((p, k) => {
    const pa = E.outQuint(prog(lt, 0.35 + k * 0.25, 0.95 + k * 0.25));
    card(ctx, p, k, 72, 580 + k * 320, pa * (1 - out), (1 - pa) * 70, col);
  });
}

function hookScene(ctx, t) {
  const a = 1 - E.outQuint(prog(t, HOOK - 0.3, HOOK));
  const t1 = E.outQuint(prog(t, 0.1, 0.6));
  txt(ctx, '사이트 공식 추천', 72, 640, { font: f(700, 40), color: GOLD, alpha: t1 * a });
  txt(ctx, '네 구간 ×', 72, 760, { font: f(900, 110), color: INK, alpha: t1 * a, ls: -3 });
  txt(ctx, '목표가·손절가', 72, 890, { font: f(900, 110), color: INK, alpha: E.outQuint(prog(t, 0.35, 0.85)) * a, ls: -3 });
  const ra = E.outQuint(prog(t, 0.8, 1.3)) * a;
  if (S.regime) txt(ctx, S.regime, 72, 1000, { font: f(700, 38), color: DIM, alpha: ra });
}

function outroScene(ctx, t) {
  const lt = t - OUT0;
  const a = E.outQuint(prog(lt, 0, 0.5));
  txt(ctx, '구간마다 8종목 전체와 근거는', 540, 760, { font: f(700, 44), color: INK, align: 'center', alpha: a });
  txt(ctx, 'stockontology.cc', 540, 880, { font: f(900, 92, NUM), color: GOLD, align: 'center', alpha: E.outQuint(prog(lt, 0.2, 0.7)), ls: -1 });
  const d = E.outQuint(prog(lt, 0.6, 1.1));
  txt(ctx, '공개 데이터를 그대로 옮긴 것이며 투자 자문·권유가 아닙니다.', 540, 1060, { font: f(600, 30), color: DIM, align: 'center', alpha: d });
  txt(ctx, '판단과 책임은 보시는 분께 있습니다.', 540, 1108, { font: f(600, 30), color: DIM, align: 'center', alpha: d });
}

defineChart({
  duration: DUR,
  hits: [...S.buckets.map((_, i) => segStart(i)), OUT0],
  draw(ctx, t) {
    background(ctx, t);
    header(ctx);
    if (t < HOOK) hookScene(ctx, t);
    else if (t < OUT0) {
      const i = Math.min(NB - 1, Math.floor((t - HOOK) / SEG));
      tabs(ctx, i);
      bucketScene(ctx, t, i);
    } else outroScene(ctx, t);
    grain(ctx, 0.05);
  },
});
</script></body></html>
